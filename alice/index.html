<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alice in Wonderland 2026</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BIPH Band">
  <link rel="apple-touch-icon" href="../icons/BGicon.png">
  <link rel="icon" href="../icons/BGicon.png">
  <link href="/tailwind.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Zapfino';
      src: url('../fonts/Zapfino.ttf') format('truetype');
    }

    :root {
      --accent: #1a4a8a;
      --record: #c0392b;
      --success: #27ae60;
      --idle: #2980b9;
      --bg: #f4f6f9;
      --card: #fff;
      --text: #222;
      --muted: #666;
    }

    * { box-sizing: border-box; }

    body {
      background: linear-gradient(to bottom, #e6e6fa, #f0f8ff);
      background-image: url('background1.webp');
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding-top: env(safe-area-inset-top);
      margin: 0;
    }

    .container {
      margin-top: 13px;
      width: 80%;
      max-width: 800px;
      background-color: rgba(255,255,255,.639);
      border-radius: 8px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 0;
      padding-bottom: 100px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0,0,0,.69);
    }

    .title-image {
      display: block;
      margin: 0 auto -50px;
      max-width: 90%;
      height: auto;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .family-section {
      background: rgba(255,255,255,.5);
      border-radius: 8px;
      margin-top: 12px;
      padding: 16px;
      box-shadow: 0 2px 14px rgba(0,0,0,.173);
      position: relative;
    }

    .family-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 2px 0 12px;
      color: #1f2937;
    }

    .btn {
      position: relative;
      transition: all .2s ease;
      background: transparent;
      color: #fff8e0;
      border: 0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: clamp(.9rem, 2.5vw, 1.1rem);
      font-weight: 600;
      touch-action: manipulation;
      flex: 1;
      min-width: 80px;
      min-height: 52px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 2px rgb(39,22,0), 0 0 6px rgb(78,78,78);
      overflow: hidden;
      z-index: 1;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 8px;
      z-index: -1;
      filter: opacity(.85) contrast(1.15);
      transition: filter .2s ease;
    }

    .btn.small::before { background-image: url('small-button.webp'); }
    .btn.medium::before { background-image: url('medium-button.webp'); }
    .btn.long::before { background-image: url('long-button.webp'); }

    .btn:hover {
      cursor: pointer;
      transform: scale(1.01);
    }

    .btn:hover::before { filter: brightness(1.05); }
    .btn:active { transform: translateY(1px); }
    .btn:active::before { filter: brightness(.95); }

    :root { --logo-size: 150px; }

    .logo {
      width: var(--logo-size);
      height: var(--logo-size);
      position: absolute;
      bottom: -30px;
      right: 25px;
      object-fit: contain;
    }

    .instrument-group {
      margin-bottom: 16px;
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      padding: 8px;
      overflow-x: auto;
    }

    .instrument-group:has(:only-child) .btn {
      width: 100%;
      margin-right: 0;
    }

    .hamburger-menu {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      left: 13px;
      z-index: 10002;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      width: 30px;
      height: 25px;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      z-index: 10003;
    }

    .menu-toggle span {
      width: 30px;
      height: 3px;
      background: white;
      border-radius: 10px;
      transition: all .3s linear;
    }

    .menu-toggle.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px,5px);
    }

    .menu-toggle.open span:nth-child(2) { opacity: 0; }

    .menu-toggle.open span:nth-child(3) {
      transform: rotate(-45deg) translate(7px,-7px);
    }

    .menu-items {
      position: absolute;
      top: 40px;
      left: -250px;
      background: linear-gradient(135deg,rgba(0,0,0,.8),rgba(30,30,30,.8));
      border-radius: 5px;
      width: 250px;
      height: 88vh;
      padding-top: 20px;
      transition: left .3s ease-in-out, opacity .3s ease-in-out;
      opacity: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      z-index: 10002;
    }

    .menu-items.show { left: 0; opacity: 1; }

    .menu-items a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity .3s ease-in-out, transform .3s ease-in-out;
      white-space: nowrap;
    }

    .menu-items.show a {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-items a:hover { background-color: rgba(255,255,255,.1); }

    .menu-items a:nth-child(1) { transition-delay: .1s; }
    .menu-items a:nth-child(2) { transition-delay: .2s; }
    .menu-items a:nth-child(3) { transition-delay: .3s; }
    .menu-items a:nth-child(4) { transition-delay: .4s; }
    .menu-items a:nth-child(5) { transition-delay: .5s; }
    .menu-items a:nth-child(6) { transition-delay: .6s; }

    .menu-title {
      text-align: center;
      color: white;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .menu-footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 12px;
    }

    .qr-image {
      display: block;
      margin: 0 auto 5px;
      width: 130px;
      height: auto;
    }

    /* Recorder view */
    #recorder-view { display: none; }
    #recorder-view.active { display: block; }

    body.recorder-page {
      display: block;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
      padding: 0 0 180px;
      min-height: 100vh;
    }

    body.recorder-page .container {
      width: 100%;
      max-width: none;
      margin: 0;
      background: transparent;
      border-radius: 0;
      padding: 0 0 20px;
      display: block;
      box-shadow: none;
      overflow: visible;
    }

    body.recorder-page .hamburger-menu,
    body.recorder-page .title-image,
    body.recorder-page .logo {
      display: none;
    }

    .recorder-meta { padding: 10px 16px 0; }

    .recorder-meta h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .recorder-meta p {
      margin: 2px 0;
      color: var(--muted);
    }

    .back-link {
      display: block;
      width: min(200px, calc(100% - 32px));
      text-align: center;
      margin: 10px 16px;
      color: white;
      font-size: .9rem;
      text-decoration: none;
      font-weight: 600;
    }

    .record-test-wrap {
      width: min(200px, calc(100% - 32px));
      padding: 0;
      margin: 0 16px 14px;
    }

    .record-playing-test {
      display: block;
      width: 100%;
      border: 1px solid #b96b68;
      border-radius: 8px;
      padding: 10px 16px;
      background: #f5e7e6;
      color: #873b38;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }

    .record-playing-test:hover { background: #eed8d7; }

    .back-link {
      display: block;
      width: min(200px, calc(100% - 32px));
      margin: 10px 16px;
      padding: 10px 14px;
      text-align: center;
      border: 1px solid #8ab0df;
      border-radius: 8px;
      background: #e7f0fb;
      color: #174b83;
      font-size: .9rem;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover { background: #d8e8fa; }

    .record-playing-test:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .page-container {
      position: relative;
      max-width: 1000px;
      margin: 0 auto 16px;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .page-container img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    .overlay-btn { display: none !important; }

    #control-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      box-shadow: 0 -4px 20px rgba(0,0,0,.12);
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      z-index: 90;
      transform: translateY(100%);
      transition: transform .25s ease;
    }

    #control-panel.visible { transform: translateY(0); }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: .95rem;
      color: var(--accent);
    }

    .close-panel {
      background: none;
      border: 0;
      font-size: 1.4rem;
      color: #888;
      cursor: pointer;
      padding: 0 8px;
    }

    .tempo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tempo-row label {
      font-size: .9rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .tempo-row input[type=range] {
      flex: 1;
      min-width: 120px;
    }

    .tempo-val {
      font-weight: 600;
      min-width: 38px;
      text-align: right;
    }

    #recorder-view .btn-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    #recorder-view .btn {
      flex: 1;
      min-width: 72px;
      min-height: 42px;
      padding: 10px 8px;
      border: 0;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-shadow: none;
    }

    #recorder-view .btn::before { display: none; }

    #recorder-view .btn-record { background: var(--record); color: white; }
    #recorder-view .btn-stop { background: #333; color: white; }
    #recorder-view .btn-play { background: #2980b9; color: white; }
    #recorder-view .btn-download { background: var(--accent); color: white; }
    #recorder-view .btn-share { background: #8e44ad; color: white; }

    /* Alice uses the summary Download button instead of the bottom Download. */
    #btn-download-all { display: none !important; }

    #recorder-view .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status-line {
      font-size: .82rem;
      color: var(--muted);
      margin-top: 6px;
      min-height: 1.2em;
    }

    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--record);
      font-weight: 600;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--record);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: .3; }
    }

    #summary {
      display: none;
      max-width: 900px;
      margin: 20px auto 40px;
      padding: 0 12px;
    }

    #summary h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .track-card {
      background: var(--card);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .track-card .label {
      font-weight: 600;
      min-width: 65px;
    }

    .track-card .status {
      font-size: .9rem;
      color: var(--muted);
      flex: 1;
    }

    .track-card .status.ready {
      color: var(--success);
      font-weight: 600;
    }

    .track-card .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .track-card button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f8f8f8;
      font-size: .85rem;
      cursor: pointer;
    }

    .global-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .global-actions .btn {
      flex: 1;
      min-width: 130px;
      padding: 12px;
    }

    .mic-warning {
      background: #fff3cd;
      color: #856404;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 12px;
      font-size: .9rem;
      display: none;
    }

    .pdf-view {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #fff;
    }

    .pdf-view iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding-left: 12px;
        padding-right: 12px;
      }

      .page-container { margin-bottom: 10px; }
      #summary { margin-top: 14px; }
    }
  </style>
</head>

<body>
  <div class="hamburger-menu">
    <button class="menu-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <div class="menu-items" id="menu-items">
      <div class="menu-title">BIPH Band</div>
      <a href="https://biphband.github.io/">Home</a>
      <a href="https://biphband.github.io/amis/">AMIS Auditions</a>
      <a href="https://biphband.github.io/alice/">Alice in Wonderland</a>
      <a href="https://biphband.github.io/tuner/">Tuner</a>
      <a href="https://biphband.github.io/camera">Video Recorder</a>
      <a href="mailto:garrison.tubbs-biph@basischina.com">Contact</a>
      <div class="menu-footer">
        <img src="../qr.png" alt="QR Code" class="qr-image">
        © Garrison Tubbs 2026
      </div>
    </div>
  </div>

  <div class="container mx-auto flex flex-col justify-center min-h-screen" id="main-container">
    <img src="alice-title.webp" alt="Alice in Wonderland" class="title-image" id="title-image">
    <div id="instrument-selection" class="space-y-6 mb-8"></div>
    <img src="Full logo original.png" class="logo" alt="BIPH Band logo">
  </div>

  <div id="recorder-view">
    <a href="#" class="back-link" id="back-to-chooser" style="margin-top:20px">
      ← Choose another part
    </a>
    <div class="record-test-wrap">
      <button type="button" id="record-playing-test" class="record-playing-test">⏺ Record playing test</button>
    </div>

    <div id="mic-warning" class="mic-warning">
      Microphone access is required. Please allow access when prompted.
    </div>

    <div id="pages-root"></div>

    <div id="control-panel">
      <div class="panel-header">
        <h2 id="panel-title">Recording</h2>
        <button class="close-panel" id="close-panel" aria-label="Close recording controls">×</button>
      </div>

      <div class="tempo-row" id="tempo-row" style="display:none">
        <label id="tempo-label">♩ =</label>
        <input type="range" id="tempo-slider" min="60" max="140" value="120">
        <span class="tempo-val" id="tempo-val">120</span>
      </div>

      <div class="btn-row">
        <button class="btn btn-record" id="btn-start-rec">● Record</button>
        <button class="btn btn-stop" id="btn-stop-rec" disabled>■ Stop</button>
        <button class="btn btn-play" id="btn-play" disabled>▶ Play</button>
        <button class="btn btn-download" id="btn-download-all" disabled>⬇ Download</button>
        <button class="btn btn-share" id="btn-share" disabled>↗ Share</button>
      </div>

      <div class="status-line" id="status-line">Ready</div>
    </div>

    <section id="summary">
      <h2>Recording</h2>
      <div id="track-list"></div>
    </section>
  </div>

  <div class="pdf-view" id="pdf-view">
    <iframe id="pdf-frame" title="Sheet music PDF"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script>
/**
 * Shared audition recorder core.
 * Alice pages may set namePromptOnStop/shareNamedMp3 to require a student's
 * name when Stop is clicked and use that name in the exported MP3 filename.
 */
window.AuditionRecorder = (() => {
  "use strict";

  let config = null;
  let currentTrack = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordedBlobs = {};
  let recordedUrls = {};
  let durations = {};
  let isRecording = false;
  let isPlaying = false;
  let currentAudio = null;
  let mediaStream = null;
  let studentName = "";
  let nameModal = null;
  let nameInput = null;
  let nameError = null;
  let nameCallbacks = [];
  let recordingStartedAt = 0;

  const $ = (id) => document.getElementById(id);

  const safeFilenamePart = (value) => String(value || "")
    .trim()
    .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
    .replace(/\s+/g, "_")
    .replace(/^\.+|\.+$/g, "")
    .replace(/_+/g, "_")
    .slice(0, 80);

  function setStatus(message) {
    const el = $("status-line");
    if (el) el.textContent = message;
  }

  function setButtonState(id, disabled) {
    const el = $(id);
    if (el) el.disabled = !!disabled;
  }

  function ensureNameModal() {
    if (nameModal) return;

    const style = document.createElement("style");
    style.id = "audition-name-modal-style";
    style.textContent = `
      .audition-name-backdrop {
        position:fixed;
        inset:0;
        z-index:100000;
        background:rgba(0,0,0,.58);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px
      }
      .audition-name-backdrop[hidden] {
        display:none !important
      }
      .audition-name-dialog {
        width:min(440px,100%);
        background:#fff;
        color:#202124;
        border-radius:16px;
        padding:24px;
        box-shadow:0 18px 70px rgba(0,0,0,.32);
        font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
      }
      .audition-name-dialog h2 {
        margin:0 0 8px;
        font-size:1.25rem;
        color:#1a4a8a
      }
      .audition-name-dialog p {
        margin:0 0 16px;
        color:#555
      }
      .audition-name-dialog label {
        display:block;
        margin-bottom:6px;
        font-weight:600;
        color:#333
      }
      .audition-name-dialog input {
        display:block;
        width:100%;
        box-sizing:border-box;
        border:1px solid #aab0b8;
        border-radius:8px;
        padding:12px;
        font:inherit;
        background:#fff;
        color:#111
      }
      .audition-name-error {
        min-height:1.3em;
        margin-top:7px;
        color:#b42318;
        font-size:.88rem
      }
      .audition-name-actions {
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:16px
      }
      .audition-name-actions button {
        border:0;
        border-radius:8px;
        padding:11px 16px;
        font:600 15px system-ui;
        cursor:pointer
      }
      .audition-name-cancel {
        background:#eceff3;
        color:#222
      }
      .audition-name-save {
        background:#1a4a8a;
        color:#fff
      }
    `;
    document.head.appendChild(style);

    nameModal = document.createElement("div");
    nameModal.className = "audition-name-backdrop";
    nameModal.hidden = true;

    nameModal.innerHTML = `
      <section
        class="audition-name-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="audition-name-title"
      >
        <h2 id="audition-name-title">What is your name?</h2>
        <p>
          Please enter your name. It will be included in the filename
          of your shared MP3 recording.
        </p>
        <form id="audition-name-form">
          <label for="audition-student-name">Student name</label>
          <input
            id="audition-student-name"
            name="studentName"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
          >
          <div
            class="audition-name-error"
            id="audition-name-error"
            aria-live="polite"
          ></div>
          <div class="audition-name-actions">
            <button
              type="button"
              class="audition-name-cancel"
              id="audition-name-cancel"
            >Cancel</button>
            <button type="submit" class="audition-name-save">
              Continue
            </button>
          </div>
        </form>

    document.body.appendChild(nameModal);

    $("audition-name-form").addEventListener("submit", (event) => {

      nameModal.hidden = true;

      callbacks.forEach((callback) => {
        try { callback(null); } catch (error) { console.error(error); }

    $("audition-name-cancel").addEventListener("click", cancelNamePrompt);

    nameModal.addEventListener("click", (event) => {
      if (event.target === nameModal) cancelNamePrompt();

    nameModal.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {

  function requestStudentName(callback) {

  async function playCountIn(bpm = 120, beats = 4) {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      throw new Error("Metronome audio is not supported in this browser.");
    }

    const audioContext = new AudioContextClass();

    try {
      await audioContext.resume();

      const beatDuration = 60 / bpm;
      const startTime = audioContext.currentTime + 0.05;

      for (let beat = 0; beat < beats; beat++) {
        const time = startTime + beat * beatDuration;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = beat === 0 ? 1200 : 880;

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.7, time + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(time);
        oscillator.stop(time + 0.08);
      }

      // Four beats at 120 BPM take two seconds.
      await new Promise(resolve =>
        window.setTimeout(resolve, beats * beatDuration * 1000)
      );
    } finally {
      await audioContext.close().catch(() => {});
    }
  }


  async function startRecording() {
    if (isRecording) return;

    if (!currentTrack) currentTrack = getTrackIds()[0] || "1";

    try {
      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        throw new Error(
          "Microphone recording is not available in this browser. " +
          "Use HTTPS and allow microphone access."
        );
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: true
      });

      const options = {};

      if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
        if (
          MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ) {
          options.mimeType = "audio/webm;codecs=opus";
        } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
          options.mimeType = "audio/mp4";
        }
      }

      mediaRecorder = new MediaRecorder(mediaStream, options);
      audioChunks = [];

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size) {
          audioChunks.push(event.data);
        }
      };

      mediaRecorder.onerror = (event) => {
        console.error("MediaRecorder error", event.error || event);
        setStatus("Recording error. Please try again.");
      };

      mediaRecorder.onstop = async () => {
        const rawType =
          (audioChunks[0] && audioChunks[0].type) ||
          mediaRecorder.mimeType ||
          "audio/webm";

        const rawBlob = new Blob(audioChunks, { type: rawType });

        durations[currentTrack] = Math.max(
          0,
          (Date.now() - recordingStartedAt) / 1000
        );

        if (rawBlob.size) {
          setStatus("Preparing your recording…");

          try {
            recordedBlobs[currentTrack] = await blobToMp3(rawBlob);
          } catch (error) {
            console.warn(
              "MP3 conversion failed; keeping original recording",
              error
            );
            recordedBlobs[currentTrack] = rawBlob;
          }

          if (recordedUrls[currentTrack]) {
            URL.revokeObjectURL(recordedUrls[currentTrack]);
          }

          recordedUrls[currentTrack] = URL.createObjectURL(
            recordedBlobs[currentTrack]
          );
        }

        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
        }

        mediaStream = null;
        isRecording = false;

        setButtonState("btn-start-rec", false);
        setButtonState("btn-stop-rec", true);
        setButtonState("btn-play", !recordedBlobs[currentTrack]);
        setButtonState(
          "btn-share",
          !Object.keys(recordedBlobs).length
        );

        renderChecklist();

        setStatus(
          recordedBlobs[currentTrack]
            ? "Recording ready."
            : "No audio was captured. Please record again."
        );
      };

            // Play the count-in before recording begins.
      if (config.tracks[currentTrack]?.metronome) {
        const track = config.tracks[currentTrack];
        const bpm = track.tempoFixed || track.defaultTempo || 120;
        const beats = track.countInBeats || 4;

        setButtonState("btn-start-rec", true);
        setButtonState("btn-stop-rec", true);
        setStatus(`Count-in: ${beats} beats at ${bpm} BPM…`);

        await playCountIn(bpm, beats);
      }

      // Start recording after the count-in has finished.
      mediaRecorder.start(250);
      recordingStartedAt = Date.now();
      isRecording = true;

      setButtonState("btn-start-rec", true);
      setButtonState("btn-stop-rec", false);
      setButtonState("btn-play", true);

      setStatus("Recording… tap Stop when finished.");

      const warning = $("mic-warning");
      if (warning) warning.style.display = "none";
    } catch (error) {
      console.error(error);

      const warning = $("mic-warning");
      if (warning) warning.style.display = "block";

      setStatus(
        error.message ||
        "Could not start recording. Please allow microphone access."
      );

      alert(
        error.message ||
        "Could not start recording. Please allow microphone access."
      );
    }
  }


  
  function stopRecording() {
    if (
      !isRecording ||
      !mediaRecorder ||
      mediaRecorder.state === "inactive"
    ) {
      return;
    }

    // Prevent another Stop click while processing.
    isRecording = false;

    setButtonState("btn-start-rec", true);
    setButtonState("btn-stop-rec", true);
    setStatus("Stopping recording…");

    // Show the custom modal immediately.
    if (config && config.namePromptOnStop) {
      ensureNameModal();
      nameModal.hidden = false;
      nameError.textContent = "";
      nameInput.value = "";

      requestAnimationFrame(() => {
        nameInput.focus();
      });
    }

    try {
      mediaRecorder.stop();
    } catch (error) {
      console.error("Unable to stop recording:", error);
      setStatus("Could not stop recording. Please try again.");
    }
  }



  async function blobToMp3(blob) {
    const type = (blob.type || "").toLowerCase();

    if (type.includes("mpeg") || type.includes("mp3")) {
      return blob;
    }

    if (!window.lamejs || !window.lamejs.Mp3Encoder) {
      throw new Error("MP3 encoder library did not load.");
    }

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      throw new Error("Audio decoding is not supported in this browser.");
    }

    const context = new AudioContextClass();

    try {
      const arrayBuffer = await blob.arrayBuffer();

      const audioBuffer = await context.decodeAudioData(
        arrayBuffer.slice(0)
      );

      const channels = Math.min(2, audioBuffer.numberOfChannels);
      const sampleRate = audioBuffer.sampleRate;

      const encoder = new window.lamejs.Mp3Encoder(
        channels,
        sampleRate,
        128
      );

      const left = audioBuffer.getChannelData(0);
      const right =
        channels > 1
          ? audioBuffer.getChannelData(1)
          : left;

      const blockSize = 1152;
      const mp3Chunks = [];

      for (let i = 0; i < left.length; i += blockSize) {
        const leftChunk = toInt16(
          left.subarray(i, i + blockSize)
        );

        let encoded;

        if (channels > 1) {
          const rightChunk = toInt16(
            right.subarray(i, i + blockSize)
          );

          encoded = encoder.encodeBuffer(leftChunk, rightChunk);
        } else {
          encoded = encoder.encodeBuffer(leftChunk);
        }

        if (encoded && encoded.length) {
          mp3Chunks.push(new Uint8Array(encoded));
        }
      }

      const finalChunk = encoder.flush();

      if (finalChunk && finalChunk.length) {
        mp3Chunks.push(new Uint8Array(finalChunk));
      }

      return new Blob(mp3Chunks, { type: "audio/mpeg" });
    } finally {
      if (context.close) {
        await context.close().catch(() => {});
      }
    }
  }

  function toInt16(floatData) {
    const output = new Int16Array(floatData.length);

    for (let i = 0; i < floatData.length; i++) {
      const sample = Math.max(-1, Math.min(1, floatData[i]));

      output[i] = sample < 0
        ? sample * 32768
        : sample * 32767;
    }

    return output;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");

    anchor.href = url;
    anchor.download = filename;
    anchor.style.display = "none";

    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    window.setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  async function getNamedMp3(trackId) {
    let blob = recordedBlobs[trackId];

    if (!blob) {
      throw new Error("No recording was found. Please record first.");
    }

    const type = (blob.type || "").toLowerCase();

    if (!type.includes("mpeg") && !type.includes("mp3")) {
      blob = await blobToMp3(blob);

      const convertedType = (blob.type || "").toLowerCase();

      if (
        !convertedType.includes("mpeg") &&
        !convertedType.includes("mp3")
      ) {
        throw new Error(
          "This recording could not be converted to MP3. Please record again."
        );
      }

      recordedBlobs[trackId] = blob;

      if (recordedUrls[trackId]) {
        URL.revokeObjectURL(recordedUrls[trackId]);
      }

      recordedUrls[trackId] = URL.createObjectURL(blob);
    }

    const safeName = safeFilenamePart(studentName);

    if (!safeName) {
      throw new Error(
        "Please enter your name before sharing or downloading."
      );
    }

    const prefix = config.filePrefix || "Recording";

    return new File(
      [blob],
      `${prefix}_${safeName}.mp3`,
      { type: "audio/mpeg" }
    );
  }

  async function downloadOne(trackId) {
    if (config && config.shareNamedMp3 && !studentName) {
      requestStudentName(() => downloadOne(trackId));
      return;
    }

    try {
      if (config && config.shareNamedMp3) {
        const file = await getNamedMp3(trackId);
        downloadBlob(file, file.name);
      } else {
        const blob = recordedBlobs[trackId];
        if (!blob) return;

        const type = (blob.type || "").toLowerCase();

        const ext =
          type.includes("mpeg") || type.includes("mp3")
            ? "mp3"
            : type.includes("mp4")
              ? "m4a"
              : "webm";

        downloadBlob(
          blob,
          `${config.filePrefix || "Recording"}_Track${trackId}.${ext}`
        );
      }
    } catch (error) {
      alert(error.message || "Download failed.");
    }
  }

  async function downloadAll() {
    const ids = Object.keys(recordedBlobs);

    if (!ids.length) {
      alert("Please record something first.");
      return;
    }

    if (config && config.shareNamedMp3) {
      if (!studentName) {
        requestStudentName(() => downloadAll());
        return;
      }

      await downloadOne(ids[0]);
      return;
    }

    if (!window.JSZip) {
      await downloadOne(ids[0]);
      return;
    }

    try {
      const zip = new window.JSZip();
      const folder = zip.folder(
        config.zipName || "Audition_Recordings"
      );

      ids.forEach((id) => {
        const blob = recordedBlobs[id];
        const type = (blob.type || "").toLowerCase();

        const ext =
          type.includes("mpeg") || type.includes("mp3")
            ? "mp3"
            : type.includes("mp4")
              ? "m4a"
              : "webm";

        folder.file(`Track${id}.${ext}`, blob);
      });

      const content = await zip.generateAsync({ type: "blob" });

      downloadBlob(
        content,
        `${config.zipName || "Audition_Recordings"}.zip`
      );
    } catch (error) {
      alert("Download failed: " + error.message);
    }
  }

  async function shareRecordings() {
    const ids = Object.keys(recordedBlobs);

    if (!ids.length) {
      alert("Please record something before sharing.");
      return;
    }

    if (config && config.shareNamedMp3) {
      if (!studentName) {
        requestStudentName(() => shareRecordings());
        return;
      }

      try {
        const file = await getNamedMp3(ids[0]);

        const shareData = {
          files: [file],
          title: file.name,
          text: `Recording by ${studentName}`
        };

        if (
          !navigator.share ||
          !navigator.canShare ||
          !navigator.canShare({ files: [file] })
        ) {
          alert(
            "This browser cannot share MP3 files directly. " +
            "Please try a supported browser or device."
          );
          return;
        }

        await navigator.share(shareData);
      } catch (error) {
        if (error.name !== "AbortError") {
          alert("Share failed: " + (error.message || error));
        }
      }

      return;
    }

    const files = ids.map((id) => {
      const blob = recordedBlobs[id];
      const type = (blob.type || "").toLowerCase();

      const ext =
        type.includes("mpeg") || type.includes("mp3")
          ? "mp3"
          : type.includes("mp4")
            ? "m4a"
            : "webm";

      return new File(
        [blob],
        `${config.filePrefix || "Recording"}_Track${id}.${ext}`,
        { type: blob.type || "application/octet-stream" }
      );
    });

    try {
      const shareData = {
        files,
        title: config.shareTitle || "Audition Recording",
        text: config.shareText || "My recording"
      };

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files })
      ) {
        await navigator.share(shareData);
      } else {
        alert("This browser cannot share these recording files directly.");
      }
    } catch (error) {
      if (error.name !== "AbortError") {
        alert("Share failed: " + (error.message || error));
      }
    }
  }

  function renderChecklist() {
    const list = $("track-list");
    if (!list) return;

    list.innerHTML = "";

    const ids = getTrackIds();

    ids.forEach((id) => {
      const track = config.tracks[id] || {};

      const card = document.createElement("div");
      card.className = "track-card";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = track.title || `Track ${id}`;

      const status = document.createElement("div");
      status.className =
        "status" + (recordedBlobs[id] ? " ready" : "");

      status.textContent = recordedBlobs[id]
        ? `Ready${durations[id] ? ` · ${Math.round(durations[id])} sec` : ""}`
        : "Not recorded yet";

      const actions = document.createElement("div");
      actions.className = "actions";

      if (recordedBlobs[id]) {
        const play = document.createElement("button");
        play.type = "button";
        play.textContent = "▶ Play";
        play.addEventListener("click", () => playTrack(id));
        actions.appendChild(play);

        const download = document.createElement("button");
        download.type = "button";
        download.textContent = "⬇ Download";
        download.addEventListener("click", () => downloadOne(id));
        actions.appendChild(download);
      }

      card.append(label, status, actions);
      list.appendChild(card);
    });

    const globalActions = document.querySelector(".global-actions");

    if (globalActions) {
      globalActions.style.display =
        Object.keys(recordedBlobs).length ? "flex" : "none";
    }

    setButtonState(
      "btn-share",
      !Object.keys(recordedBlobs).length
    );

    setButtonState(
      "btn-download-all",
      !Object.keys(recordedBlobs).length
    );
  }

  function playTrack(trackId) {
    const url = recordedUrls[trackId];

    if (!url) {
      setStatus("No saved recording is available to play.");
      return;
    }

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(url);
    isPlaying = true;

    currentAudio.onended = () => {
      isPlaying = false;
      setStatus("Playback finished.");
    };

    currentAudio.onerror = () => {
      isPlaying = false;
      setStatus("Could not play this recording.");
    };

    currentAudio.play()
      .then(() => setStatus("Playing recording…"))
      .catch((error) => {
        isPlaying = false;
        setStatus("Playback failed: " + error.message);
      });
  }

  function bindControls() {
    const start = $("btn-start-rec");
    const stop = $("btn-stop-rec");
    const play = $("btn-play");
    const share = $("btn-share");
    const download = $("btn-download-all");

    if (start) start.onclick = startRecording;
    if (stop) stop.onclick = stopRecording;
    if (play) play.onclick = () => currentTrack && playTrack(currentTrack);
    if (share) share.onclick = shareRecordings;
    if (download) download.onclick = downloadAll;

    const slider = $("tempo-slider");

    if (slider) {
      slider.addEventListener("input", () => {
        const value = $("tempo-val");
        if (value) value.textContent = slider.value;
      });
    }
  }

  function init(nextConfig) {
    config = nextConfig || {};

    currentTrack = null;
    audioChunks = [];
    recordedBlobs = {};
    recordedUrls = {};
    durations = {};
    isRecording = false;
    isPlaying = false;
    studentName = "";
    nameCallbacks = [];

    if (mediaStream) {
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
    }

    if (nameModal) {
      nameModal.remove();
      nameModal = null;
      nameInput = null;
      nameError = null;
    }

    renderPages();
    bindControls();
    renderChecklist();

    setButtonState("btn-start-rec", false);
    setButtonState("btn-stop-rec", true);
    setButtonState("btn-play", true);
    setButtonState("btn-share", true);

    setStatus("Ready");

    if (config.tracks) {
      const ids = getTrackIds();
      if (ids.length === 1) currentTrack = ids[0];
    }

  }

  return { init, requestStudentName };
})();

    const recorderView = document.getElementById('recorder-view');
    const pdfView = document.getElementById('pdf-view');
    const pdfFrame = document.getElementById('pdf-frame');

    let currentFile = null;
    let currentMode = 'chooser';

    function displayNameFromFile(file) {
      let name = file
        .replace("Alice's Theme-", '')
        .replace('.pdf', '')
        .replace(/_/g, ' ');

      if (file === 'Alice_Seating_Chart.pdf') name = 'Seating Chart';
      if (file === "Alice's Theme-Conductor.pdf") name = 'Conductor';
      if (name === 'Alto Sax') name = 'Alto Sax';

      return name.split(' ')
        .map(w => w ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w)
        .join(' ');
    }

    function imagePathsFor(file) {
      if (imageOverrides[file]) return imageOverrides[file];

      const stem = file.replace(/\.pdf$/i, '');
      const paths = [`Alice_Parts/${stem}.jpeg`];

      if (twoPageParts.has(file)) {
        paths.push(`Alice_Parts/${stem}-2.jpeg`);
      }

      return paths;
    }

    function isPdfOnly(file) {
      return file === "Alice's Theme-Piano.pdf" ||
        file === "Alice's Theme-Conductor.pdf" ||
        file === 'Alice_Seating_Chart.pdf';
    }

    function showInstrumentSelection() {
      instrumentSelection.innerHTML = '';

      for (const [family, groups] of Object.entries(pdfFiles)) {
        if (!groups.flat().length) continue;

        const familyDiv = document.createElement('div');
        familyDiv.className = 'family-section';

        const title = document.createElement('h3');
        title.className = 'family-title';
        title.textContent = family;
        familyDiv.appendChild(title);

        groups.forEach(instruments => {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'instrument-group';

          const sizeClass = instruments.length === 1
            ? 'long'
            : instruments.length === 3 ? 'small' : 'medium';

          instruments.forEach(file => {
            const btn = document.createElement('button');
            btn.className = `btn ${sizeClass}`;
            btn.textContent = displayNameFromFile(file);

            btn.addEventListener('click', e => {
              e.preventDefault();
              displayContent(file);
            });

            groupDiv.appendChild(btn);
          });

          familyDiv.appendChild(groupDiv);
        });

        instrumentSelection.appendChild(familyDiv);
      }
    }

    function displayContent(file) {
      currentFile = file;

      if (isPdfOnly(file)) {
        currentMode = 'pdf';
        mainContainer.style.display = 'none';
        recorderView.classList.remove('active');
        document.body.classList.remove('recorder-page');
        document.querySelector('.hamburger-menu').style.display = 'none';
        pdfView.style.display = 'block';

        pdfFrame.src = file === 'Alice_Seating_Chart.pdf'
          ? file
          : `Alice_Parts/${file}`;

        history.pushState({aliceView: 'pdf'}, '', location.href);
        window.scrollTo(0, 0);
        return;
      }

      openRecorderForPart(file);
    }

    function openRecorderForPart(file) {
      if (!window.AuditionRecorder) {
        alert('The recording tools could not be initialized. Please reload the page.');
        return;
      }

      const images = imagePathsFor(file);
      const partName = displayNameFromFile(file);

      const cfg = {
        headerTitle: 'Alice in Wonderland 2026',
        headerSub: partName,
        filePrefix: `Alice_${partName.replace(/[^A-Za-z0-9]+/g, '_')}`,
        zipName: `Alice_${partName.replace(/[^A-Za-z0-9]+/g, '_')}_Recording`,
        shareTitle: `Alice in Wonderland – ${partName}`,
        shareText: `My recording for Alice in Wonderland: ${partName}`,

        
        // Ask for the student's name as soon as this recording page opens.
        // Include the name in the shared/downloaded MP3 filename.
        namePromptOnStop: false,
        shareNamedMp3: true,


        pages: images.map((image, i) => ({
          image,
          alt: `${partName}, page ${i + 1}`,
          buttons: i === 0 ? [{track: 1, top: '2%'}] : []
        })),

        tracks: {
          1: {
            title: `${partName} – Recording`,
            tempoFixed: 120,
            tempoMin: 120,
            tempoMax: 120,
            defaultTempo: 120,
            tempoLabel: '♩ =',
            metronome: true,
            countInBeats: 4,
            note: 'Ready to record. Tap Record, then Stop when finished.'
          }
        }
      };

      currentMode = 'recorder';
      mainContainer.style.display = 'none';
      pdfView.style.display = 'none';
      document.querySelector('.hamburger-menu').style.display = 'none';
      document.body.classList.add('recorder-page');
      recorderView.classList.add('active');

      window.AuditionRecorder.init(cfg);

      history.pushState({aliceView: 'recorder'}, '', location.href);

      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;

    }

    function restoreChooser() {
      recorderView.classList.remove('active');
      document.body.classList.remove('recorder-page');
      mainContainer.style.display = '';
      pdfView.style.display = 'none';
      pdfFrame.src = 'about:blank';
      document.querySelector('.hamburger-menu').style.display = '';
      currentMode = 'chooser';
      currentFile = null;
      window.scrollTo(0, 0);
    }

    document.getElementById('back-to-chooser').addEventListener('click', e => {
      e.preventDefault();

      if (history.state && history.state.aliceView) {
        history.back();
      } else {
        restoreChooser();
      }
    });

    document.getElementById('close-panel').addEventListener('click', () => {
      document.getElementById('control-panel').classList.remove('visible');
    });

    document.getElementById('record-playing-test').addEventListener('click', () => {
      openTrack('1');
      window.AuditionRecorder.requestStudentName(name => {
        if (!name) {
          // Cancel the name prompt but stay on the selected music part.
          document.getElementById('control-panel').classList.remove('visible');
          document.getElementById('summary').style.display = 'none';
          return;
        }
        document.getElementById('control-panel').classList.add('visible');
      });
    });

    window.addEventListener('popstate', () => {
      if (currentMode !== 'chooser') restoreChooser();
    });

    const menuToggle = document.querySelector('.menu-toggle');
    const menuItems = document.querySelector('.menu-items');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('open');
      menuItems.classList.toggle('show');
    });

    document.addEventListener('click', event => {
      if (!menuToggle.contains(event.target) && !menuItems.contains(event.target)) {
        menuToggle.classList.remove('open');
        menuItems.classList.remove('show');
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        menuToggle.classList.remove('open');
        menuItems.classList.remove('show');
      }
    });

    function updateBackground() {
      const hour = new Date().getHours();

      document.body.style.backgroundImage =
        (hour >= 6 && hour < 18)
          ? "url('background1.webp')"
          : "url('background2.webp')";
    }

    updateBackground();
    setInterval(updateBackground, 5 * 60 * 1000);

    window.addEventListener('pageshow', () => {
      if (currentMode === 'chooser') window.scrollTo(0, 0);
    });

    showInstrumentSelection();
  </script>
</body>
</html>
