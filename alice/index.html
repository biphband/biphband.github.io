<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alice in Wonderland 2026</title>
     
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="BIPH Band">
    <link rel="apple-touch-icon" href="../icons/BGicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <link rel="icon" href="../icons/BGicon.png">
  <link href="/tailwind.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Zapfino';
      src: url('../fonts/Zapfino.ttf') format('truetype');
    }

    body {
      background: linear-gradient(to bottom, #e6e6fa, #f0f8ff);
      background-image: url('background1.webp');
      background-attachment: fixed;
      background-size: cover; 
      background-position: center;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh; 
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding-top: env(safe-area-inset-top);
    }

    .container {
      margin-top: 13px;
      width: 80%;
      max-width: 800px; 
      background-color: rgba(255, 255, 255, 0.639); 
      border-radius: 8px;
      padding: 26px;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      padding-top: 0px; 
      padding-bottom: 100px;
      position: relative; 
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0, 0, 0, 0.69); 
    }

    .title-image {
      display: block;
      margin: 0 auto -50px;
      max-width: 90%;
      height: auto;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .family-section { 
      background: rgba(255, 255, 255, 0.5); 
      border-radius: 8px; 
      margin-top: 12px; 
      padding: 16px; 
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.173); 
      position: relative; 
    }

    .family-title { 
      font-size: 1.25rem; 
      font-weight: 700; 
      margin-top: 2px; 
      margin-bottom: 12px; 
      color: #1f2937; 
    }

    .btn { 
      position: relative;
      transition: all 0.2s ease; 
      background: transparent;
      color: #fff8e0;
      border: none;
      border-radius: 8px; 
      padding: 14px 18px; 
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 600;
      touch-action: manipulation;
      flex: 1; 
      min-width: 80px; 
      min-height: 52px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 
        0 1px 2px rgb(39, 22, 0),
        0 0 6px rgb(78, 78, 78);
      overflow: hidden;
      z-index: 1;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 8px;
      z-index: -1;
      filter: opacity(0.85) contrast(1.15);
      transition: filter 0.2s ease;
    }

    .btn.small::before  { background-image: url('small-button.webp'); }
    .btn.medium::before { background-image: url('medium-button.webp'); }
    .btn.long::before   { background-image: url('long-button.webp'); }

    .btn:hover { 
      cursor: pointer;
      transform: scale(1.01);
    }

    .btn:hover::before {
      filter: brightness(1.05);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:active::before {
      filter: brightness(0.95);
    }

    :root {
      --logo-size: 150px;
    }

    .logo {
      width: var(--logo-size);
      height: var(--logo-size);
      position: absolute;
      bottom: -30px; 
      right: 25px; 
      object-fit: contain;
    }

    .instrument-group {
      margin-bottom: 16px;
      display: flex;
      flex-wrap: nowrap; 
      gap: 12px; 
      padding: 8px; 
      overflow-x: auto; 
    }

    .instrument-group:has(:only-child) .btn {
      width: 100%;
      margin-right: 0; 
    }

    .hamburger-menu {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      left: 13px;
      z-index: 10002;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      width: 30px;
      height: 25px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 10003;
    }

    .menu-toggle span {
      width: 30px;
      height: 3px;
      background: white;
      border-radius: 10px;
      transition: all 0.3s linear;
    }

    .menu-toggle.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .menu-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.open span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    .menu-items {
      position: absolute;
      top: 40px;
      left: -250px;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(30, 30, 30, 0.8));
      border-radius: 5px;
      width: 250px;
      height: 88vh;
      padding-top: 20px;
      transition: left 0.3s ease-in-out, opacity 0.3s ease-in-out;
      opacity: 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      z-index: 10002;
    }

    .menu-items.show {
      left: 0;
      opacity: 1;
    }

    .menu-items a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
      white-space: nowrap;
    }

    .menu-items.show a {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-items a:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .menu-items a:nth-child(1) { transition-delay: 0.1s; }
    .menu-items a:nth-child(2) { transition-delay: 0.2s; }
    .menu-items a:nth-child(3) { transition-delay: 0.3s; }
    .menu-items a:nth-child(4) { transition-delay: 0.4s; }
    .menu-items a:nth-child(5) { transition-delay: 0.5s; }
    .menu-items a:nth-child(6) { transition-delay: 0.6s; }
    .menu-items a:nth-child(7) { transition-delay: 0.7s; }
    .menu-items a:nth-child(8) { transition-delay: 0.8s; }
    .menu-items a:nth-child(9) { transition-delay: 0.9s; }
    .menu-items a:nth-child(10) { transition-delay: 1.0s; }
    .menu-items a:nth-child(11) { transition-delay: 1.1s; }

    .menu-title {
      text-align: center;
      color: white;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .menu-footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 12px;
    }

    .qr-image {
      display: block;
      margin: 0 auto 5px;
      width: 130px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="hamburger-menu">
  <button class="menu-toggle">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="menu-items" id="menu-items">
    <div class="menu-title">BIPH Band</div>
    <a href="https://biphband.github.io/">Home</a>
    <a href="https://biphband.github.io/amis/">AMIS Auditions</a>
    <a href="https://biphband.github.io/alice/">Alice in Wonderland</a>
    <a href="https://biphband.github.io/tuner/">Tuner</a>
    <a href="https://biphband.github.io/camera">Video Recorder</a>
    <a href="mailto:garrison.tubbs-biph@basischina.com">Contact</a>
    <div class="menu-footer"><img src="../qr.png" alt="QR Code" class="qr-image">© Garrison Tubbs 2026</div>
  </div>
</div>

  <div class="container mx-auto flex flex-col justify-center min-h-screen">
    <img src="alice-title.webp" alt="Alice Title" class="title-image" id="title-image">

    <div id="instrument-selection" class="space-y-6 mb-8"></div>
    <img src="Full logo original.png" class="logo">
  </div>

  <script>
    const pdfFiles = {
      Strings: [
        ["Alice's Theme-Violin_1.pdf", "Alice's Theme-Violin_2.pdf", "Alice's Theme-Violin_3.pdf"],
        ["Alice's Theme-Cello_1.pdf", "Alice's Theme-Cello_2.pdf"],
        ["Alice's Theme-Contrabass.pdf"]
      ],
      Woodwind: [
        ["Alice's Theme-Flute_1.pdf", "Alice's Theme-Flute_2.pdf", "Alice's Theme-Flute_3.pdf"],
        ["Alice's Theme-Clarinet_1.pdf", "Alice's Theme-Clarinet_2.pdf", "Alice's Theme-Clarinet_3.pdf"],
        ["Alice's Theme-Bass_Clarinet.pdf", "Alice's Theme-Bassoon.pdf"],
        ["Alice's Theme-Alto_Saxophone_1.pdf", "Alice's Theme-Alto_Saxophone_2.pdf", "Alice's Theme-Tenor_Saxophone.pdf"]
      ],
      Brass: [
        ["Alice's Theme-Trumpet_1.pdf", "Alice's Theme-Trumpet_2.pdf"],
        ["Alice's Theme-Horn.pdf"],
        ["Alice's Theme-Trombone.pdf", "Alice's Theme-Euphonium.pdf"],
        ["Alice's Theme-Tuba.pdf"]
      ],
      Percussion: [
        ["Alice's Theme-Percussion_1.pdf", "Alice's Theme-Marimba.pdf"],
        ["Alice's Theme-Drum_Kit.pdf"],
        ["Alice's Theme-Timpani.pdf", "Alice's Theme-Piano.pdf"]
      ],
      Other: [
        ["Alice's Theme-Conductor.pdf"],
        ["Alice_Seating_Chart.pdf"]          // keep this one as-is if it really has no "Alice's Theme-"
      ]
    };

    const instrumentSelection = document.getElementById('instrument-selection');

    function showInstrumentSelection() {
      instrumentSelection.innerHTML = '';
      for (const [family, groups] of Object.entries(pdfFiles)) {
        if (groups.flat().length === 0) continue;
        const familyDiv = document.createElement('div');
        familyDiv.className = 'family-section';
        familyDiv.innerHTML = `<h3 class="family-title">${family}</h3>`;
        groups.forEach((instruments) => {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'instrument-group';

          // Choose button size based on how many are in this row
          let sizeClass = 'medium';
          if (instruments.length === 1) sizeClass = 'long';
          else if (instruments.length === 3) sizeClass = 'small';
          else if (instruments.length === 2) sizeClass = 'medium';

          instruments.forEach(file => {
            let displayName = file
              .replace("Alice's Theme-", "")
              .replace(".pdf", "")
              .replace(/_/g, " ");

            // Special short names
            if (displayName === "Alto Saxophone 1") displayName = "Alto Sax 1";
            if (displayName === "Alto Saxophone 2") displayName = "Alto Sax 2";
            if (displayName === "Tenor Saxophone")  displayName = "Tenor Sax";
            if (file === "Alice_Seating_Chart.pdf") displayName = "Seating Chart";
            if (file === "Alice's Theme-Conductor.pdf") displayName = "Conductor";

            // Capitalize properly
            displayName = displayName.split(' ')
              .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
              .join(' ');

            const btn = document.createElement('button');
            btn.className = `btn ${sizeClass}`;
            btn.textContent = displayName;

            ['click', 'touchstart'].forEach(eventType => {
              btn.addEventListener(eventType, (e) => {
                e.preventDefault();
                displayContent(file);
              });
            });
            groupDiv.appendChild(btn);
          });
          familyDiv.appendChild(groupDiv);
        });
        instrumentSelection.appendChild(familyDiv);
      }
    }

    function displayContent(file) {
      let filePath;

      if (file === 'Alice_Seating_Chart.pdf') {
        filePath = file;                    // load from root directory
      } else {
        filePath = `Alice_Parts/${file}`;
      }

      window.location.href = filePath;
    }

    // Hamburger menu
    const menuToggle = document.querySelector('.menu-toggle');
    const menuItems = document.querySelector('.menu-items');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('open');
      menuItems.classList.toggle('show');
    });

    window.addEventListener('pageshow', function (event) {
    // Always reset scroll, especially important after bfcache restore
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
});

    document.addEventListener('click', (event) => {
      if (!menuToggle.contains(event.target) && !menuItems.contains(event.target)) {
        menuToggle.classList.remove('open');
        menuItems.classList.remove('show');
      }
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        menuToggle.classList.remove('open');
        menuItems.classList.remove('show');
      }
    });

    // Automatic day / night background based on device clock
    function updateBackground() {
      const hour = new Date().getHours();          // 0–23
      // Daytime (light mode): 6:00 – 17:59
      // Nighttime (dark mode): 18:00 – 5:59
      if (hour >= 6 && hour < 18) {
        document.body.style.backgroundImage = "url('background1.webp')";
      } else {
        document.body.style.backgroundImage = "url('background2.webp')";
      }
    }

    updateBackground();                             // set on page load
    setInterval(updateBackground, 5 * 60 * 1000);   // re-check every 5 minutes

    showInstrumentSelection();
  </script>
</body>
</html>
