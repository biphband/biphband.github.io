<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alice in Wonderland 2026</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BIPH Band">
  <link rel="apple-touch-icon" href="../icons/BGicon.png">
  <link rel="icon" href="../icons/BGicon.png">
  <link href="/tailwind.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family:'Zapfino'; src:url('../fonts/Zapfino.ttf') format('truetype'); }
    :root { --accent:#1a4a8a; --record:#c0392b; --success:#27ae60; --idle:#2980b9; --bg:#f4f6f9; --card:#fff; --text:#222; --muted:#666; }
    * { box-sizing:border-box; }
    body {
      background:linear-gradient(to bottom,#e6e6fa,#f0f8ff);
      background-image:url('background1.webp'); background-attachment:fixed; background-size:cover; background-position:center;
      font-family:'Roboto',sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center;
      overflow-x:hidden; overflow-y:auto; padding-top:env(safe-area-inset-top); margin:0;
    }
    .container { margin-top:13px; width:80%; max-width:800px; background-color:rgba(255,255,255,.639); border-radius:8px; padding:26px; display:flex; flex-direction:column; justify-content:space-between; padding-top:0; padding-bottom:100px; position:relative; overflow:hidden; box-shadow:0 2px 24px rgba(0,0,0,.69); }
    .title-image { display:block; margin:0 auto -50px; max-width:90%; height:auto; cursor:default; user-select:none; -webkit-user-select:none; }
    .family-section { background:rgba(255,255,255,.5); border-radius:8px; margin-top:12px; padding:16px; box-shadow:0 2px 14px rgba(0,0,0,.173); position:relative; }
    .family-title { font-size:1.25rem; font-weight:700; margin:2px 0 12px; color:#1f2937; }
    .btn { position:relative; transition:all .2s ease; background:transparent; color:#fff8e0; border:0; border-radius:8px; padding:14px 18px; font-size:clamp(.9rem,2.5vw,1.1rem); font-weight:600; touch-action:manipulation; flex:1; min-width:80px; min-height:52px; text-align:center; display:flex; align-items:center; justify-content:center; text-shadow:0 1px 2px rgb(39,22,0),0 0 6px rgb(78,78,78); overflow:hidden; z-index:1; }
    .btn::before { content:""; position:absolute; inset:0; background-size:100% 100%; background-repeat:no-repeat; background-position:center; border-radius:8px; z-index:-1; filter:opacity(.85) contrast(1.15); transition:filter .2s ease; }
    .btn.small::before { background-image:url('small-button.webp'); } .btn.medium::before { background-image:url('medium-button.webp'); } .btn.long::before { background-image:url('long-button.webp'); }
    .btn:hover { cursor:pointer; transform:scale(1.01); } .btn:hover::before { filter:brightness(1.05); } .btn:active { transform:translateY(1px); } .btn:active::before { filter:brightness(.95); }
    :root { --logo-size:150px; }
    .logo { width:var(--logo-size); height:var(--logo-size); position:absolute; bottom:-30px; right:25px; object-fit:contain; }
    .instrument-group { margin-bottom:16px; display:flex; flex-wrap:nowrap; gap:12px; padding:8px; overflow-x:auto; }
    .instrument-group:has(:only-child) .btn { width:100%; margin-right:0; }
    .hamburger-menu { position:absolute; top:calc(20px + env(safe-area-inset-top)); left:13px; z-index:10002; }
    .menu-toggle { display:flex; flex-direction:column; justify-content:space-around; width:30px; height:25px; background:transparent; border:0; cursor:pointer; padding:0; z-index:10003; }
    .menu-toggle span { width:30px; height:3px; background:white; border-radius:10px; transition:all .3s linear; }
    .menu-toggle.open span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); } .menu-toggle.open span:nth-child(2) { opacity:0; } .menu-toggle.open span:nth-child(3) { transform:rotate(-45deg) translate(7px,-7px); }
    .menu-items { position:absolute; top:40px; left:-250px; background:linear-gradient(135deg,rgba(0,0,0,.8),rgba(30,30,30,.8)); border-radius:5px; width:250px; height:88vh; padding-top:20px; transition:left .3s ease-in-out,opacity .3s ease-in-out; opacity:0; box-shadow:0 8px 32px rgba(0,0,0,.3); z-index:10002; }
    .menu-items.show { left:0; opacity:1; } .menu-items a { display:flex; align-items:center; gap:14px; padding:14px 22px; color:white; text-decoration:none; font-size:1rem; opacity:0; transform:translateX(-20px); transition:opacity .3s ease-in-out,transform .3s ease-in-out; white-space:nowrap; }
    .menu-items.show a { opacity:1; transform:translateX(0); } .menu-items a:hover { background-color:rgba(255,255,255,.1); }
    .menu-items a:nth-child(1){transition-delay:.1s}.menu-items a:nth-child(2){transition-delay:.2s}.menu-items a:nth-child(3){transition-delay:.3s}.menu-items a:nth-child(4){transition-delay:.4s}.menu-items a:nth-child(5){transition-delay:.5s}.menu-items a:nth-child(6){transition-delay:.6s}
    .menu-title { text-align:center; color:white; font-size:18px; margin-bottom:10px; } .menu-footer { position:absolute; bottom:10px; width:100%; text-align:center; color:white; font-size:12px; }
    .qr-image { display:block; margin:0 auto 5px; width:130px; height:auto; }

    /* Recorder view */
    #recorder-view { display:none; }
    #recorder-view.active { display:block; }
    body.recorder-page { display:block; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.4; padding:0 0 180px; min-height:100vh; }
    body.recorder-page .container { width:100%; max-width:none; margin:0; background:transparent; border-radius:0; padding:0 0 20px; display:block; box-shadow:none; overflow:visible; }
    body.recorder-page .hamburger-menu, body.recorder-page .title-image, body.recorder-page .logo { display:none; }
    .recorder-meta { padding:10px 16px 0; } .recorder-meta h1 { margin:0; font-size:1.2rem; color:var(--accent); } .recorder-meta p { margin:2px 0; color:var(--muted); }
    .back-link { display:inline-block; margin:10px 16px; color: white;; font-size:.9rem; text-decoration:none; font-weight:600; }
    .page-container { position:relative; max-width:1000px; margin:0 auto 16px; background:white; box-shadow:0 4px 20px rgba(0,0,0,.08); overflow:hidden; }
    .page-container img { display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none; }
    .overlay-btn { display:none !important; }
    #control-panel { position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #ddd; box-shadow:0 -4px 20px rgba(0,0,0,.12); padding:10px 12px calc(12px + env(safe-area-inset-bottom)); z-index:90; transform:translateY(100%); transition:transform .25s ease; }
    #control-panel.visible { transform:translateY(0); }
    .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .panel-header h2 { margin:0; font-size:.95rem; color:var(--accent); }
    .close-panel { background:none; border:0; font-size:1.4rem; color:#888; cursor:pointer; padding:0 8px; }
    .tempo-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
    .tempo-row label { font-size:.9rem; color:var(--muted); white-space:nowrap; } .tempo-row input[type=range] { flex:1; min-width:120px; } .tempo-val { font-weight:600; min-width:38px; text-align:right; }
    #recorder-view .btn-row { display:flex; gap:7px; flex-wrap:wrap; }
    #recorder-view .btn { flex:1; min-width:72px; min-height:42px; padding:10px 8px; border:0; border-radius:8px; font-size:.9rem; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; text-shadow:none; }
    #recorder-view .btn::before { display:none; }
    #recorder-view .btn-record { background:var(--record); color:white; } #recorder-view .btn-stop { background:#333; color:white; } #recorder-view .btn-play { background:#2980b9; color:white; }
    #recorder-view .btn-download { background:var(--accent); color:white; } #recorder-view .btn-share { background:#8e44ad; color:white; }
    #recorder-view .btn:disabled { opacity:.45; cursor:not-allowed; }
    .status-line { font-size:.82rem; color:var(--muted); margin-top:6px; min-height:1.2em; }
    .rec-indicator { display:inline-flex; align-items:center; gap:6px; color:var(--record); font-weight:600; } .rec-dot { width:10px; height:10px; border-radius:50%; background:var(--record); animation:blink 1s infinite; }
    @keyframes blink { 50% { opacity:.3; } }
    #summary { max-width:900px; margin:20px auto 40px; padding:0 12px; }
    #summary h2 { font-size:1.1rem; margin-bottom:10px; color:var(--accent); }
    .track-card { background:var(--card); border-radius:10px; padding:12px 14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.06); display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .track-card .label { font-weight:600; min-width:65px; } .track-card .status { font-size:.9rem; color:var(--muted); flex:1; } .track-card .status.ready { color:var(--success); font-weight:600; }
    .track-card .actions { display:flex; gap:6px; flex-wrap:wrap; } .track-card button { padding:8px 12px; border-radius:6px; border:1px solid #ccc; background:#f8f8f8; font-size:.85rem; cursor:pointer; }
    .global-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; } .global-actions .btn { flex:1; min-width:130px; padding:12px; }
    .mic-warning { background:#fff3cd; color:#856404; padding:10px 14px; border-radius:8px; margin:12px; font-size:.9rem; display:none; }
    .pdf-view { display:none; width:100%; min-height:100vh; background:#fff; }
    .pdf-view iframe { display:block; width:100%; height:100vh; border:0; }
    @media(max-width:600px) { .container { width:94%; padding-left:12px; padding-right:12px; } .page-container { margin-bottom:10px; } #summary { margin-top:14px; } }
  </style>
</head>
<body>
  <div class="hamburger-menu">
    <button class="menu-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="menu-items" id="menu-items">
      <div class="menu-title">BIPH Band</div>
      <a href="https://biphband.github.io/">Home</a>
      <a href="https://biphband.github.io/amis/">AMIS Auditions</a>
      <a href="https://biphband.github.io/alice/">Alice in Wonderland</a>
      <a href="https://biphband.github.io/tuner/">Tuner</a>
      <a href="https://biphband.github.io/camera">Video Recorder</a>
      <a href="mailto:garrison.tubbs-biph@basischina.com">Contact</a>
      <div class="menu-footer"><img src="../qr.png" alt="QR Code" class="qr-image">© Garrison Tubbs 2026</div>
    </div>
  </div>

  <div class="container mx-auto flex flex-col justify-center min-h-screen" id="main-container">
    <img src="alice-title.webp" alt="Alice in Wonderland" class="title-image" id="title-image">
    <div id="instrument-selection" class="space-y-6 mb-8"></div>
    <img src="Full logo original.png" class="logo" alt="BIPH Band logo">
  </div>

  <div id="recorder-view">
    <a href="#" class="back-link" id="back-to-chooser" style="margin-top:20px">← Choose another part</a>
    <div id="mic-warning" class="mic-warning">Microphone access is required. Please allow access when prompted.</div>
    <div id="pages-root"></div>
    <div id="control-panel">
      <div class="panel-header"><h2 id="panel-title">Recording</h2><button class="close-panel" id="close-panel" aria-label="Close recording controls">×</button></div>
      <div class="tempo-row" id="tempo-row" style="display:none"><label id="tempo-label">♩ =</label><input type="range" id="tempo-slider" min="60" max="140" value="120"><span class="tempo-val" id="tempo-val">120</span></div>
      <div class="btn-row">
        <button class="btn btn-record" id="btn-start-rec">● Record</button>
        <button class="btn btn-stop" id="btn-stop-rec" disabled>■ Stop</button>
        <button class="btn btn-play" id="btn-play" disabled>▶ Play</button>
        <button class="btn btn-download" id="btn-download-all" disabled>⬇ Download</button>
        <button class="btn btn-share" id="btn-share" disabled>↗ Share</button>
      </div>
      <div class="status-line" id="status-line">Ready</div>
    </div>
    <section id="summary"><h2>Recording</h2><div id="track-list"></div></section>
  </div>

  <div class="pdf-view" id="pdf-view"><iframe id="pdf-frame" title="Sheet music PDF"></iframe></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="../amis/recorder-core.js"></script>
  <script>
    const pdfFiles = {
      Strings: [
        ["Alice's Theme-Violin_1.pdf", "Alice's Theme-Violin_2.pdf", "Alice's Theme-Violin_3.pdf"],
        ["Alice's Theme-Viola_1.pdf", "Alice's Theme-Viola_2.pdf"],
        ["Alice's Theme-Cello_1.pdf", "Alice's Theme-Cello_2.pdf", "Alice's Theme-Cello_3.pdf"],
        ["Alice's Theme-Cello_4.pdf", "Alice's Theme-Contrabass.pdf", "Alice's Theme-Contrabass_2.pdf"]
      ],
      Woodwind: [
        ["Alice's Theme-Flute_1.pdf", "Alice's Theme-Flute_2.pdf", "Alice's Theme-Flute_3.pdf"],
        ["Alice's Theme-Clarinet_1.pdf", "Alice's Theme-Clarinet_2.pdf", "Alice's Theme-Clarinet_3.pdf"],
        ["Alice's Theme-Bass_Clarinet.pdf"],
        ["Alice's Theme-Alto_Sax.pdf", "Alice's Theme-Tenor_Saxophone.pdf"]
      ],
      Brass: [
        ["Alice's Theme-Trumpet_1.pdf", "Alice's Theme-Trumpet_2.pdf", "Alice's Theme-Trumpet_3.pdf"],
        ["Alice's Theme-Horn.pdf"],
        ["Alice's Theme-Trombone.pdf", "Alice's Theme-Euphonium.pdf"],
        ["Alice's Theme-Tuba.pdf"]
      ],
      Percussion: [
        ["Alice's Theme-Snare_Drum.pdf", "Alice's Theme-Aux_Percussion.pdf"],
        ["Alice's Theme-Glockenspiel.pdf", "Alice's Theme-Marimba.pdf"],
        ["Alice's Theme-Timpani.pdf", "Alice's Theme-Piano.pdf"]
      ],
      Other: [["Alice's Theme-Conductor.pdf"], ["Alice_Seating_Chart.pdf"]]
    };

    // The six known two-page parts are shown as two stacked images.
    // Image filenames use the PDF's basename plus .jpeg; page two adds -2,
    // except the confirmed Flute 1 filenames, which are explicitly mapped below.
    const twoPageParts = new Set([
      "Alice's Theme-Violin_1.pdf", "Alice's Theme-Violin_2.pdf",
      "Alice's Theme-Clarinet_1.pdf", "Alice's Theme-Clarinet_2.pdf",
      "Alice's Theme-Flute_1.pdf", "Alice's Theme-Flute_2.pdf"
    ]);
    const imageOverrides = {
      "Alice's Theme-Flute_1.pdf": [
        "Alice_Parts/Alice's Theme-Flute_1.jpeg",
        "Alice_Parts/Alice's Theme-Flute_1-2.jpeg"
      ]
    };
    const instrumentSelection = document.getElementById('instrument-selection');
    const mainContainer = document.getElementById('main-container');
    const recorderView = document.getElementById('recorder-view');
    const pdfView = document.getElementById('pdf-view');
    const pdfFrame = document.getElementById('pdf-frame');
    let currentFile = null;
    let currentMode = 'chooser';

    function displayNameFromFile(file) {
      let name = file.replace("Alice's Theme-", '').replace('.pdf', '').replace(/_/g, ' ');
      if (file === 'Alice_Seating_Chart.pdf') name = 'Seating Chart';
      if (file === "Alice's Theme-Conductor.pdf") name = 'Conductor';
      if (name === 'Alto Sax') name = 'Alto Sax';
      return name.split(' ').map(w => w ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w).join(' ');
    }

    function imagePathsFor(file) {
      if (imageOverrides[file]) return imageOverrides[file];
      const stem = file.replace(/\.pdf$/i, '');
      const paths = [`Alice_Parts/${stem}.jpeg`];
      if (twoPageParts.has(file)) paths.push(`Alice_Parts/${stem}-2.jpeg`);
      return paths;
    }

    function isPdfOnly(file) {
      return file === "Alice's Theme-Piano.pdf" || file === "Alice's Theme-Conductor.pdf" || file === 'Alice_Seating_Chart.pdf';
    }

    function showInstrumentSelection() {
      instrumentSelection.innerHTML = '';
      for (const [family, groups] of Object.entries(pdfFiles)) {
        if (!groups.flat().length) continue;
        const familyDiv = document.createElement('div');
        familyDiv.className = 'family-section';
        const title = document.createElement('h3'); title.className = 'family-title'; title.textContent = family; familyDiv.appendChild(title);
        groups.forEach(instruments => {
          const groupDiv = document.createElement('div'); groupDiv.className = 'instrument-group';
          let sizeClass = instruments.length === 1 ? 'long' : instruments.length === 3 ? 'small' : 'medium';
          instruments.forEach(file => {
            const btn = document.createElement('button'); btn.className = `btn ${sizeClass}`; btn.textContent = displayNameFromFile(file);
            btn.addEventListener('click', e => { e.preventDefault(); displayContent(file); });
            groupDiv.appendChild(btn);
          });
          familyDiv.appendChild(groupDiv);
        });
        instrumentSelection.appendChild(familyDiv);
      }
    }

    function displayContent(file) {
      currentFile = file;
      if (isPdfOnly(file)) {
        currentMode = 'pdf';
        mainContainer.style.display = 'none';
        recorderView.classList.remove('active');
        document.body.classList.remove('recorder-page');
        document.querySelector('.hamburger-menu').style.display = 'none';
        pdfView.style.display = 'block';
        pdfFrame.src = file === 'Alice_Seating_Chart.pdf' ? file : `Alice_Parts/${file}`;
        history.pushState({aliceView:'pdf'}, '', location.href);
        window.scrollTo(0, 0);
        return;
      }
      openRecorderForPart(file);
    }

    function openRecorderForPart(file) {
      if (!window.AuditionRecorder) {
        alert('The recorder core did not load. Check that ../amis/recorder-core.js exists.');
        return;
      }
      const images = imagePathsFor(file);
      const partName = displayNameFromFile(file);
      const cfg = {
        headerTitle: 'Alice in Wonderland 2026',
        headerSub: partName,
        filePrefix: `Alice_${partName.replace(/[^A-Za-z0-9]+/g, '_')}`,
        zipName: `Alice_${partName.replace(/[^A-Za-z0-9]+/g, '_')}_Recording`,
        shareTitle: `Alice in Wonderland – ${partName}`,
        shareText: `My recording for Alice in Wonderland: ${partName}`,
        pages: images.map((image, i) => ({
          image,
          alt: `${partName}, page ${i + 1}`,
          // The core requires an overlay button to open its control panel.
          // CSS hides it; we click it programmatically after initialization.
          buttons: i === 0 ? [{track:1, top:'2%'}] : []
        })),
        tracks: {
          1: {
            title: `${partName} – Recording`,
            tempoFixed: 120, tempoMin: 120, tempoMax: 120, defaultTempo: 120,
            tempoLabel: '♩ =', metronome: false, countInBeats: 4,
            note: 'Ready to record. Tap Record, then Stop when finished.'
          }
        }
      };
      currentMode = 'recorder';
      mainContainer.style.display = 'none';
      pdfView.style.display = 'none';
      document.querySelector('.hamburger-menu').style.display = 'none';
      document.body.classList.add('recorder-page');
      recorderView.classList.add('active');
      window.AuditionRecorder.init(cfg);
      // document.getElementById('header-title').textContent = 'Alice in Wonderland 2026';
      // document.getElementById('header-sub').textContent = partName;
      history.pushState({aliceView:'recorder'}, '', location.href);
      window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
      requestAnimationFrame(() => {
        const hiddenTrigger = document.querySelector('#btn-track1');
        if (hiddenTrigger) hiddenTrigger.click();
      });
    }

    function restoreChooser() {
      recorderView.classList.remove('active');
      document.body.classList.remove('recorder-page');
      mainContainer.style.display = '';
      pdfView.style.display = 'none';
      pdfFrame.src = 'about:blank';
      document.querySelector('.hamburger-menu').style.display = '';
      currentMode = 'chooser';
      currentFile = null;
      window.scrollTo(0, 0);
    }

    document.getElementById('back-to-chooser').addEventListener('click', e => {
      e.preventDefault();
      if (history.state && history.state.aliceView) history.back(); else restoreChooser();
    });
    document.getElementById('close-panel').addEventListener('click', () => {
      // The recorder core won't close the panel while recording; chooser link remains available.
      document.getElementById('control-panel').classList.remove('visible');
    });
    window.addEventListener('popstate', () => {
      if (currentMode !== 'chooser') restoreChooser();
    });

    const menuToggle = document.querySelector('.menu-toggle');
    const menuItems = document.querySelector('.menu-items');
    menuToggle.addEventListener('click', () => { menuToggle.classList.toggle('open'); menuItems.classList.toggle('show'); });
    document.addEventListener('click', event => {
      if (!menuToggle.contains(event.target) && !menuItems.contains(event.target)) { menuToggle.classList.remove('open'); menuItems.classList.remove('show'); }
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { menuToggle.classList.remove('open'); menuItems.classList.remove('show'); } });

    function updateBackground() {
      const hour = new Date().getHours();
      document.body.style.backgroundImage = (hour >= 6 && hour < 18) ? "url('background1.webp')" : "url('background2.webp')";
    }
    updateBackground(); setInterval(updateBackground, 5 * 60 * 1000);
    window.addEventListener('pageshow', () => { if (currentMode === 'chooser') window.scrollTo(0, 0); });
    showInstrumentSelection();
  </script>
</body>
</html>
