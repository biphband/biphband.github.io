<script>
const levelSelection=document.getElementById('level-selection');
const contentSelection=document.getElementById('content-selection');
const instrumentSelection=document.getElementById('instrument-selection');
const instructionsContent=document.getElementById('instructions-content');
const recorderView=document.getElementById('recorder-view');
const mainContainer=document.getElementById('main-container');
const menuToggle=document.querySelector('.menu-toggle');
const menuItems=document.querySelector('.menu-items');
const middleSchoolBtn=document.getElementById('btn-middle-school');
const highSchoolBtn=document.getElementById('btn-high-school');
const instructionsBtn=document.getElementById('btn-instructions');

let currentLevel=null;
let currentView=null;

const instrumentData={
  MS:{
    Strings:[
      {key:'violin',name:'Violin'},
      {key:'viola',name:'Viola'},
      {key:'cello',name:'Cello'},
      {key:'bass',name:'Contrabass'}
    ],
    Woodwinds:[
      {key:'flute',name:'Flute'},
      {key:'altosax',name:'Alto Sax'}
    ],
    Brass:[
      {key:'trumpet',name:'Trumpet'}
    ]
  },
  HS:{
    Strings:[
      {key:'violin',name:'Violin'},
      {key:'cello',name:'Cello'}
    ],
    Woodwinds:[
      {key:'flute',name:'Flute'},
      {key:'clarinet',name:'Clarinet'}
    ],
    Brass:[
      {key:'trumpet',name:'Trumpet'},
      {key:'horn',name:'Horn'},
      {key:'euphonium',name:'Euphonium'},
      {key:'tuba',name:'Tuba'}
    ],
    Percussion:[
      {key:'percussion',name:'Percussion'}
    ]
  }
};

function snapToTop(){
  const startTime=performance.now();
  const duration=1000;
  const startY=window.scrollY;

  function scrollUp(now){
    const progress=Math.min((now-startTime)/duration,1);
    const eased=1-Math.pow(1-progress,3);
    const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
    const targetY=Math.min(0,maxY);
    const y=startY+(targetY-startY)*eased;

    window.scrollTo(0,y);

    if(progress<1) requestAnimationFrame(scrollUp);
  }

  requestAnimationFrame(scrollUp);
}

function snapToContent(){
  const start=performance.now();
  const duration=1800;
  const speed=1000;

  function scrollDown(now){
    const elapsed=now-start;
    if(elapsed>=duration) return;
    window.scrollBy(0,speed/60);
    requestAnimationFrame(scrollDown);
  }

  requestAnimationFrame(scrollDown);
}

function setActiveButton(button){
  [middleSchoolBtn,highSchoolBtn,instructionsBtn].forEach(btn=>{
    btn.classList.remove('active');
  });
  if(button) button.classList.add('active');
}

function buildInstrumentSelection(level){
  instrumentSelection.innerHTML='';
  const groups=instrumentData[level];
  const levelLabel=level==='HS'?'High School':'Middle School';

  Object.entries(groups).forEach(([family,instruments])=>{
    const familyDiv=document.createElement('div');
    familyDiv.className='family-section';

    const title=document.createElement('h3');
    title.className='family-title';
    title.textContent=`${levelLabel} ${family}`;
    familyDiv.appendChild(title);

    const groupDiv=document.createElement('div');
    groupDiv.className='instrument-group';

    instruments.forEach(instrument=>{
      const btn=document.createElement('button');
      btn.className='btn level-btn';
      btn.textContent=instrument.name;
      btn.addEventListener('click',()=>{
        openRecorder(level,instrument.key);
      });
      groupDiv.appendChild(btn);
    });

    familyDiv.appendChild(groupDiv);
    instrumentSelection.appendChild(familyDiv);
  });
}

function expandSelection(level){
  currentLevel=level;
  currentView='level';
  instructionsContent.style.display='none';
  instrumentSelection.style.display='block';
  buildInstrumentSelection(level);
  contentSelection.classList.add('expanded');
  setActiveButton(level==='MS'?middleSchoolBtn:highSchoolBtn);
  snapToContent();
}

function expandInstructions(){
  currentLevel=null;
  currentView='instructions';
  instrumentSelection.style.display='none';
  instructionsContent.style.display='block';
  contentSelection.classList.add('expanded');
  setActiveButton(instructionsBtn);
  snapToContent();
}

function collapseSelection(){
  currentLevel=null;
  currentView=null;
  contentSelection.classList.remove('expanded');
  setActiveButton(null);
  requestAnimationFrame(()=>{
    snapToTop();
  });
}

function toggleLevel(level){
  if(currentView==='level'&&currentLevel===level){
    collapseSelection();
    return;
  }
  expandSelection(level);
}

function toggleInstructions(){
  if(currentView==='instructions'){
    collapseSelection();
    return;
  }
  expandInstructions();
}

function openRecorder(group,key){
  let cfg=null;

  if(group==='MS'){
    cfg=window.MSInstruments[key];
  }else if(group==='HS'){
    cfg=window.HSInstruments[key];
  }

  if(!cfg){
    alert('Config not found for '+key);
    return;
  }

  document.body.classList.add('recorder-page');
  mainContainer.classList.add('recorder-mode');

  levelSelection.style.display='none';
  contentSelection.style.display='none';
  recorderView.classList.add('active');

  window.AuditionRecorder.init(cfg);
  window.scrollTo(0,0);
}

function closeRecorder(){
  recorderView.classList.remove('active');
  document.body.classList.remove('recorder-page');
  mainContainer.classList.remove('recorder-mode');

  levelSelection.style.display='block';
  contentSelection.style.display='block';

  if(currentView==='level'){
    contentSelection.classList.add('expanded');
    instrumentSelection.style.display='block';
    instructionsContent.style.display='none';
    setActiveButton(currentLevel==='MS'?middleSchoolBtn:highSchoolBtn);
  }else if(currentView==='instructions'){
    contentSelection.classList.add('expanded');
    instrumentSelection.style.display='none';
    instructionsContent.style.display='block';
    setActiveButton(instructionsBtn);
  }else{
    contentSelection.classList.remove('expanded');
    instrumentSelection.style.display='none';
    instructionsContent.style.display='none';
    setActiveButton(null);
  }

  snapToTop();
}

middleSchoolBtn.addEventListener('click',()=>{
  toggleLevel('MS');
});

highSchoolBtn.addEventListener('click',()=>{
  toggleLevel('HS');
});

instructionsBtn.addEventListener('click',()=>{
  toggleInstructions();
});

document.getElementById('back-to-chooser').addEventListener('click',(e)=>{
  e.preventDefault();
  closeRecorder();
});

menuToggle.addEventListener('click',()=>{
  menuToggle.classList.toggle('open');
  menuItems.classList.toggle('show');
});

document.addEventListener('click',(event)=>{
  if(!menuToggle.contains(event.target)&&!menuItems.contains(event.target)){
    menuToggle.classList.remove('open');
    menuItems.classList.remove('show');
  }
});

document.addEventListener('keydown',(event)=>{
  if(event.key==='Escape'){
    menuToggle.classList.remove('open');
    menuItems.classList.remove('show');
  }
});

currentLevel=null;
currentView=null;
levelSelection.style.display='block';
contentSelection.style.display='block';
instrumentSelection.style.display='none';
instructionsContent.style.display='none';
contentSelection.classList.remove('expanded');
setActiveButton(null);
recorderView.classList.remove('active');
</script>

</body>
</html>
