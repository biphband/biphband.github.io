<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            overflow: hidden;
            touch-action: none;
            cursor: none;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        let particles = [];
        let touches = new Map();

        const COLORS = [
            '#a0ffff', '#ff88ff', '#88ffcc', '#ffff88',
            '#88aaff', '#ffcc88', '#cc88ff'
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2.2;
                this.vy = (Math.random() - 0.5) * 2.2;
                this.size = Math.random() * 2.9 + 1.2;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.life = 0.92;
                this.entropy = Math.random() * 1.4 + 0.8;   // higher entropy
                this.entropyPhase = Math.random() * Math.PI * 2;
            }

            update(activeTargets) {
                let influenced = false;

                for (let target of activeTargets) {
                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 260) {
                        const baseAngle = Math.atan2(dy, dx);

                        if (dist > 38) {
                            // Very gentle pull-in phase
                            const pull = 0.22 * (1 - dist / 260);   // greatly reduced gravity
                            this.vx += Math.cos(baseAngle) * pull * 0.75;
                            this.vy += Math.sin(baseAngle) * pull * 0.75;
                        } else {
                            // Random swirling when very close
                            const swirl = baseAngle + Math.PI / 2 + Math.sin(Date.now() * 0.0018 + this.entropyPhase) * 1.1;
                            const swirlForce = 0.35 * (1 - dist / 38);
                            this.vx += Math.cos(swirl) * swirlForce * 0.65;
                            this.vy += Math.sin(swirl) * swirlForce * 0.65;
                        }

                        influenced = true;
                    }
                }

                if (!influenced) {
                    // High entropy idle - returns quickly and feels more random
                    this.vx += (Math.random() - 0.5) * this.entropy * 0.18;
                    this.vy += (Math.random() - 0.5) * this.entropy * 0.18;
                    this.vx *= 0.972;   // faster return to natural drift
                    this.vy *= 0.972;
                }

                // Hard speed limit - very calm movement
                const speed = Math.hypot(this.vx, this.vy);
                if (speed > 2.35) {
                    this.vx = (this.vx / speed) * 2.35;
                    this.vy = (this.vy / speed) * 2.35;
                }

                this.x += this.vx;
                this.y += this.vy;

                this.life = Math.max(0.45, this.life - 0.00068);

                if (this.x < -85) this.x = width + 85;
                if (this.x > width + 85) this.x = -85;
                if (this.y < -85) this.y = height + 85;
                if (this.y > height + 85) this.y = -85;
            }

            draw() {
                ctx.shadowBlur = 14;
                ctx.shadowColor = this.color;
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
            }
        }

        function spawnFromOutside() {
            const side = Math.floor(Math.random() * 4);
            let x, y;

            switch (side) {
                case 0: x = Math.random() * width; y = -60; break;
                case 1: x = width + 60; y = Math.random() * height; break;
                case 2: x = Math.random() * width; y = height + 60; break;
                case 3: x = -60; y = Math.random() * height; break;
            }

            const p = new Particle(x, y);
            p.vx = (Math.random() - 0.5) * 2.4;
            p.vy = (Math.random() - 0.5) * 2.4;
            particles.push(p);
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 740; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.088)';
            ctx.fillRect(0, 0, width, height);

            const activeTargets = Array.from(touches.values());

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(activeTargets);
                p.draw();

                if (p.life < 0.08) particles.splice(i, 1);
            }

            if (Math.random() < 0.48) spawnFromOutside();

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        function handleStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            touches.clear();

            if (e.touches) {
                for (let t of e.touches) {
                    touches.set(t.identifier, {
                        x: t.clientX - rect.left,
                        y: t.clientY - rect.top
                    });
                }
            } else {
                touches.set('mouse', {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                });
            }
        }

        function handleMove(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();

            if (e.touches) {
                touches.clear();
                for (let t of e.touches) {
                    touches.set(t.identifier, {
                        x: t.clientX - rect.left,
                        y: t.clientY - rect.top
                    });
                }
            } else if (touches.has('mouse')) {
                touches.set('mouse', {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                });
            }
        }

        function handleEnd() {
            touches.clear();
        }

        function addListeners() {
            canvas.addEventListener('pointerdown', handleStart);
            canvas.addEventListener('pointermove', handleMove);
            canvas.addEventListener('pointerup', handleEnd);
            canvas.addEventListener('pointerleave', handleEnd);

            canvas.addEventListener('touchstart', handleStart, { passive: false });
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            canvas.addEventListener('touchend', handleEnd);
            canvas.addEventListener('touchcancel', handleEnd);
        }

        function start() {
            initParticles();
            addListeners();
            animate();
        }

        start();
    </script>
</body>
</html>
