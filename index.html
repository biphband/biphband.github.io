<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIPH Band</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="BIPH Band">
    <link rel="apple-touch-icon" href="icons/BGicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <link rel="icon" href="icons/BGicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

    <link rel="preload" href="https://biphband.github.io/fonts/Zapfino.ttf" as="font" type="font/ttf" crossorigin>

    <style>
        @font-face {
            font-family: 'Zapfino';
            src: url('https://biphband.github.io/fonts/Zapfino.ttf') format('truetype');
            font-display: swap; /* Show fallback instantly, swap when ready */
        }
        
        body {
            background-color: rgba(45, 70, 119);
            font-family: 'Andika', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            margin: 0;
            line-height: 1.6;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }

        .background {
            position: fixed;
            opacity: 0.05;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('backgroundimage.png');
            background-size: 140% auto; 
            background-position: center center; 
            background-repeat: no-repeat;
            z-index: -3;
        }
        .blue-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(45, 70, 119, 0.25), rgba(9, 32, 79, 0.25));
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 70%, #303f6c 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, #236693 0%, transparent 50%);
            mix-blend-mode: overlay;
            opacity: 0.5;
            z-index: -1;
            animation: pulse 1.5s infinite alternate;
        }
        .overlay2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 70%, #ffffff 0%, transparent 50%),
                        radial-gradient(circle at 30% 30%, #b8b8b8 0%, transparent 50%);
            mix-blend-mode: overlay;
            opacity: 0.5;
            z-index: -1;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.1); }
        }

        .logocontainer {
            min-height: 10vh;
            padding-bottom: 10px;
        }

        .logo {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 25vh;
            height: auto;
            z-index: 10; 
        }

        .Title {
            font-family: 'Andika', system-ui, -apple-system, sans-serif;
            font-size: 3rem;
            font-weight: 300;
            text-align: center;
            margin-top: 100px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .Subtitle {
            font-family: 'Zapfino', 'Brush Script MT', 'Segoe Script', cursive, sans-serif;
            color: white;
            font-size: 2.5rem;
            text-align: center;
            margin-top: -5px;
            padding-top: 0.5em;
        }

        /* Hamburger Menu */
        .hamburger-menu {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            margin-left: 7px;
            top: 20px;
            left: 13px;
            z-index: 1000;
        }

        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 25px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
        }

        .menu-toggle span {
            width: 30px;
            height: 3px;
            background: white;
            border-radius: 10px;
            transition: all 0.3s linear;
        }

        .menu-toggle.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-toggle.open span:nth-child(2) { opacity: 0; }
        .menu-toggle.open span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }

        .menu-items {
            position: absolute;
            top: 25px;
            left: -250px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(30, 30, 30, 0.8));
            border-radius: 5px;
            width: 250px;
            height: 90vh;
            padding-top: 20px;
            transition: all 0.3s ease-in-out;
            opacity: 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .menu-items.show {
            left: 0;
            opacity: 1;
        }

        .menu-items a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 22px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            white-space: nowrap;
        }

        .menu-items.show a { opacity: 1; transform: translateX(0); }

        .menu-items a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .menu-items a:nth-child(1) { transition-delay: 0.1s; }
        .menu-items a:nth-child(2) { transition-delay: 0.2s; }
        .menu-items a:nth-child(3) { transition-delay: 0.3s; }
        .menu-items a:nth-child(4) { transition-delay: 0.4s; }
        .menu-items a:nth-child(5) { transition-delay: 0.5s; }
        .menu-items a:nth-child(6) { transition-delay: 0.6s; }
        .menu-items a:nth-child(7) { transition-delay: 0.7s; }

        .menu-title {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .menu-footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 12px;
        }

        .qr-image {
            display: block;
            margin: 0 auto 5px;
            width: 130px;
            height: auto;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 18px 40px;
            font-family: 'Andika', system-ui, -apple-system, sans-serif;
            font-size: 1.6rem;
            color: white;
            text-decoration: none;
            background: linear-gradient(135deg, rgba(35, 102, 147, 0.9), rgba(48, 63, 108, 0.9));
            border: 2px solid #ffffff;
            border-radius: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 380px;
            position: relative;
            overflow: hidden;
        }

        .button:hover {
            background: linear-gradient(135deg, rgba(48, 63, 108, 1), rgba(35, 102, 147, 1));
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .button-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            transition: all 0.3s ease;
        }

        .button:hover .button-icon {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="blue-overlay"></div>
    <div class="overlay"></div>
    <div class="overlay2"></div>

    <!-- Hamburger Menu -->
    <div class="hamburger-menu">
        <button class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="menu-items" id="menu-items">
            <div class="menu-title">BIPH Music</div>
            <a href="https://biphband.github.io/">Home</a>
            <a href="https://biphband.github.io/amis">AMIS Audition Music</a>
            <a href="https://biphband.github.io/alice/">Alice in Wonderland</a>
            <a href="https://biphband.github.io/tuner/">Tuner</a>
            <a href="https://biphband.github.io/camera/">Video Recorder</a>
            <a href="mailto:garrison.tubbs-biph@basischina.com">Contact</a>
            <div class="menu-footer">
                <img src="qr.png" alt="QR Code" class="qr-image">
                © Garrison Tubbs 2026
            </div>
        </div>
    </div>

    <h1 class="Title">BIPH</h1>
    <h1 class="Subtitle" style="font-size: 34px; margin: 0px 0;">Band and Orchestra</h1>

    <!-- Buttons are now in the static HTML so they appear immediately (no JS injection delay) -->
    <div class="container" id="main-content">
        <a href="https://biphband.github.io/amis" class="button">
            <img src="sheetmusic.png" alt="AMIS" class="button-icon">
            <span>AMIS Audition Music</span>
        </a>

        <a href="https://biphband.github.io/alice/" class="button">
            <img src="sheetmusic.png" alt="Alice" class="button-icon">
            <span>Alice in Wonderland</span>
        </a>
    </div>

    <div class="logocontainer">        
        <img src="logo.png" alt="BASIS Logo" class="logo">
    </div>

    <script>
        function toggleMenu() {
            const menuToggle = document.querySelector('.menu-toggle');
            const menuItems = document.querySelector('.menu-items');
            menuToggle.classList.toggle('open');
            menuItems.classList.toggle('show');
        }

        document.addEventListener('click', (event) => {
            const menuToggle = document.querySelector('.menu-toggle');
            const menuItems = document.querySelector('.menu-items');
            if (!menuToggle.contains(event.target) && !menuItems.contains(event.target)) {
                menuToggle.classList.remove('open');
                menuItems.classList.remove('show');
            }
        });

        function getHongKongTime() {
            const now = new Date();
            return new Date(now.toLocaleString("en-US", { timeZone: "Asia/Hong_Kong" }));
        }

        function isSpecialTime() {
            const time = getHongKongTime();
            const day = time.getDay();      // 0=Sun, 1-5=Mon-Fri
            const hour = time.getHours();
            const minute = time.getMinutes();

            // Weekdays only
            if (day < 1 || day > 5) return false;

            // 10:00 AM to 11:45 AM inclusive
            if (hour === 10 || (hour === 11 && minute <= 45)) {
                return true;
            }
            return false;
        }

        function redirectToTheory() {
            window.location.href = "https://biphmusic.github.io";
        }

        window.addEventListener('pageshow', function (event) {
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (isSpecialTime()) {
                redirectToTheory();
            }
        });
    </script>
</body>
</html>
