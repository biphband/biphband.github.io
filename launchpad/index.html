            height: 560px;
            background: #0c0c12;
            padding: 28px;
            border-radius: 24px;

            user-select: none;

            width: 100%;
            height: 100%;
            background: #1a1a22;
            border-radius: 10px;
            cursor: pointer;

            align-items: center;
            justify-content: center;
            font-size: 10px;

            position: relative;

        border: 1px solid rgba(200, 200, 200, 0.35);

        }

    const MIDI_CHANNEL = 1;
    
    function getNote(row, col) {
        return (row + 1) * 10 + (col + 1);
    }

    function getRowColFromNote(note) {
        const row = Math.floor(note / 10) - 1;
        const col = (note % 10) - 1;
        return { row, col };
    }

    function hexToHsl(hex) {
        let r = parseInt(hex.slice(1, 3), 16) / 255;
        let g = parseInt(hex.slice(3, 5), 16) / 255;
        let b = parseInt(hex.slice(5, 7), 16) / 255;
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max == min) {
            h = s = 0;
        } else {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return [h * 360, s * 100, l * 100];
    }

    colorPalette.sort((a, b) => {
        if (a.v === 0) return -1;
        if (b.v === 0) return 1;
        const hslA = hexToHsl(a.hex);
        const hslB = hexToHsl(b.hex);
        if (hslA[2] > 90 && hslB[2] < 90) return -1;
        if (hslB[2] > 90 && hslA[2] < 90) return 1;
        if (hslA[1] < 10 && hslB[1] > 10) return -1;
        if (hslB[1] < 10 && hslA[1] > 10) return 1;
        if (Math.abs(hslA[0] - hslB[0]) > 2) return hslA[0] - hslB[0];
        return hslB[2] - hslA[2];
    });

    const velocityToColorMap = new Map(colorPalette.map(c => [c.v, c]));
    const allPads = []; 

    function getColorByVelocity(velocity) {
        if (velocityToColorMap.has(velocity)) {
            return velocityToColorMap.get(velocity);
        }
        const sortedVelocities = Array.from(velocityToColorMap.keys()).sort((a, b) => a - b);
        let closest = sortedVelocities[0];
        for (const v of sortedVelocities) {
            if (Math.abs(v - velocity) < Math.abs(closest - velocity)) {
                closest = v;
            }
        }
        return velocityToColorMap.get(closest);
    }

                output = outputs.find(o => o.name.toLowerCase().includes("launchpad")) || outputs[0];
                input = inputs.find(i => i.name.toLowerCase().includes("launchpad")) || inputs[0];
                
                let statusText = "MIDI ready";
                if (output) statusText += ` • Out: ${output.name}`;
                if (input) {
                    statusText += ` • In: ${input.name}`;
                    input.onmidimessage = handleMIDIMessage;
                }
                midiStatusEl.textContent = statusText;
            };
            midiAccess.onstatechange = updatePorts;
            updatePorts();
        } catch (err) {
            midiStatusEl.textContent = `MIDI Error: ${err.message}`;
        }
    }

    function sendNoteOn(note, velocity) {
        if (!output) return false;
        try {
            output.send([0x90 | (MIDI_CHANNEL - 1), note, velocity]);
            return true;
        } catch (e) {
            return false;
        }
    }

    function pushAllToLaunchpad() {
        if (!output) {
            alert("No MIDI Output detected.");
            return;
        }
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const note = getNote(r, c);
                const velocity = padStates[note] || 0;
                sendNoteOn(note, velocity);
            }

    }

    function updatePadVisual(row, col, velocity) {
        const pad = document.querySelector(`.pad[data-row="${row}"][data-col="${col}"]`);
        if (!pad) return;
        const color = getColorByVelocity(velocity);
        pad.style.backgroundColor = color.hex;

            pad.style.boxShadow = `inset 0 6px 16px rgba(0,0,0,0.7), 0 4px 10px rgba(0,0,0,0.5)`;
            pad.querySelector('.pad-label').style.color = 'rgba(255,255,255,0.25)';
        } else {

            pad.querySelector('.pad-label').style.color = 'rgba(255,255,255,0.75)';
        }
        padStates[getNote(row, col)] = velocity;
    }

    function createLaunchpad() {
        launchpadEl = document.getElementById("launchpad");
        launchpadEl.innerHTML = "";

                label.className = "pad-label";

                pad.appendChild(label);
                pad.addEventListener("click", (e) => handlePadClick(row, col, e));
                updatePadVisual(row, col, 0); 
                launchpadEl.appendChild(pad);
                allPads.push({ element: pad, row, col, note: getNote(row, col) });
            }
        }
    }

    function handlePadClick(row, col, e) {
        const note = getNote(row, col);
        const currentPad = {row, col, note};

        if (e.ctrlKey || e.metaKey) { // Multi-selection/toggle
            const exists = Array.from(selectedPads).some(p => p.row === row && p.col === col);
            if (exists) {
                selectedPads = new Set(Array.from(selectedPads).filter(p => !(p.row === row && p.col === col)));
            } else {
                selectedPads.add(currentPad);
            }
            lastClickedPad = currentPad;
        } else if (e.shiftKey && lastClickedPad) { // Range selection in order
            const startIdx = allPads.findIndex(p => p.row === lastClickedPad.row && p.col === lastClickedPad.col);
            const endIdx = allPads.findIndex(p => p.row === row && p.col === col);

            if (startIdx !== -1 && endIdx !== -1) {
                // Find the current min/max indices of selected pads for extending
                // If no pads selected, treat lastClickedPad as the only anchor
                let currentMinIdx = startIdx; 
                let currentMaxIdx = startIdx;

                if (selectedPads.size > 0) {
                    const currentSelectedNotes = Array.from(selectedPads).map(p => p.note);
                    const sortedSelectedIndices = Array.from(selectedPads).map(p => allPads.findIndex(ap => ap.note === p.note)).sort((a,b) => a-b);
                    currentMinIdx = sortedSelectedIndices[0];
                    currentMaxIdx = sortedSelectedIndices[sortedSelectedIndices.length - 1];
                }

                let newMinIdx = currentMinIdx;
                let newMaxIdx = currentMaxIdx;

                // Extend based on the direction of movement from the 'last clicked' pad
                if (endIdx < currentMinIdx) { // Moving left/up from current selection
                    newMinIdx = Math.min(endIdx, startIdx); // Also consider startIdx if it's new
                    newMaxIdx = Math.max(currentMaxIdx, startIdx);
                } else if (endIdx > currentMaxIdx) { // Moving right/down from current selection
                    newMinIdx = Math.min(currentMinIdx, startIdx);
                    newMaxIdx = Math.max(endIdx, startIdx);
                } else { // Target is within or overlaps existing selection
                    // This complex case is simplified for user experience:
                    // If moving within the existing range, or starting a new range with shift,
                    // re-calculate based on lastClickedPad and target.
                    // For a clean extension, if moving beyond current min/max, extend.
                    // If moving within, re-anchor from the closest of the two ends.
                    const absDiffToMin = Math.abs(endIdx - currentMinIdx);
                    const absDiffToMax = Math.abs(endIdx - currentMaxIdx);

                    if (absDiffToMin < absDiffToMax) { // Target is closer to min, extend/contract from min
                        newMinIdx = endIdx;
                        newMaxIdx = currentMaxIdx;
                    } else { // Target is closer to max, extend/contract from max
                        newMinIdx = currentMinIdx;
                        newMaxIdx = endIdx;
                    }
                }

                selectedPads.clear();
                for (let i = Math.min(newMinIdx, newMaxIdx); i <= Math.max(newMinIdx, newMaxIdx); i++) {
                    selectedPads.add(allPads[i]);
                }
            }
            lastClickedPad = currentPad; // Update last clicked for potential chaining
        } else { // Single selection
            selectedPads.clear();
            selectedPads.add(currentPad);
            lastClickedPad = currentPad;
        }

        refreshSelectionVisuals();
        updateVelocityDisplayForSelected();
    }


    function deselectAllPads() {
        selectedPads.clear();
        lastClickedPad = null;
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected();
    }

    function deselectAllOnContainerClick(e) {

    function refreshSelectionVisuals() {
        document.querySelectorAll('.pad').forEach(pad => {

            const c = parseInt(pad.dataset.col);
            const isSelected = Array.from(selectedPads).some(s => s.row === r && s.col === c);

        });

    function updateVelocityDisplayForSelected() {
        if (selectedPads.size > 0) {
            const first = Array.from(selectedPads)[0];
            currentVelocity = padStates[first.note] || 0;
            velocityValueEl.textContent = currentVelocity;
        } else {
            velocityValueEl.textContent = '';
        }

function applyColorToSelected(velocity, recordUndo = false) {
    if (selectedPads.size === 0) return;

    if (recordUndo) {
        const changes = Array.from(selectedPads).map(({ note }) => ({
            note,
            oldVelocity: padStates[note] || 0,
            newVelocity: velocity
        }));
        recordHistory(changes);
    }

    selectedPads.forEach(({row, col, note}) => {
        updatePadVisual(row, col, velocity);
        sendNoteOn(note, velocity);
    });

    // Ensure visuals reflect that these pads are STILL selected
    refreshSelectionVisuals();
    updateVelocityDisplayForSelected();
}


function clearAll() {
        const changes = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const note = getNote(r, c);
                const oldVelocity = padStates[note] || 0;
                if (oldVelocity !== 0) { // Only record if it was actually changed
                    changes.push({ note, oldVelocity, newVelocity: 0 });
                }
                updatePadVisual(r, c, 0);
                sendNoteOn(getNote(r, c), 0);
            }
        }
        if (changes.length > 0) {
            recordHistory(changes);
        }
        deselectAllPads();
        hideMenuModal();
    }


    function handleMIDIMessage(e) {
        const [status, note, velocity] = e.data;
        const isPadNote = (note >= 11 && note <= 88) && (note % 10 !== 0) && (note % 10 !== 9);
        if ((status & 0xF0) === 0x90 && isPadNote) {
            const { row, col } = getRowColFromNote(note);
            if (velocity > 0) {
                selectedPads.clear();
                selectedPads.add({row, col, note});
                lastClickedPad = {row, col, note};
                refreshSelectionVisuals();
                updateVelocityDisplayForSelected();
            }
        }
    }

    document.querySelector('.launchpad-container').addEventListener('click', (e) => {
    if (!e.target.closest('.pad')) {
        deselectAllPads();
    }
    });

function handleKeyboard(e) {
    // 1. Guard: Color Search Modal
    if (colorModal.style.display === 'flex') { 
        handleModalKeyboard(e); 
        return; 
    }
    
    // 2. Guard: Hamburger Menu
    if (menuModal.style.display === 'flex') {
        if (e.key === "Escape") hideMenuModal();
        return;
    }

    // 3. Guard: Velocity Input Focus
    if (document.activeElement === velocityValueEl) {
        if (e.key === "Enter") {
            e.preventDefault();
            velocityValueEl.blur();
        }
        return;
    }

    // 4. Utility: Deselect
    if (e.key === "Escape") { 
        deselectAllPads(); 
        return; 
    }

    // 5. Velocity Shortcuts: Cmd/Ctrl + Arrow Up/Down
    if ((e.metaKey || e.ctrlKey) && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
        e.preventDefault();
        const direction = e.key === "ArrowUp" ? 1 : -1;
        const oldVelocity = currentVelocity;
        currentVelocity = Math.max(0, Math.min(127, currentVelocity + direction));
        velocityValueEl.textContent = currentVelocity;
        
        if (oldVelocity !== currentVelocity && selectedPads.size > 0) {
             applyColorToSelected(currentVelocity, true);
        }
        return;
    }

    // 6. Undo/Redo/Select All
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
        return;
    }
    if (((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'z') || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y')) {
        e.preventDefault();
        redo();
        return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        selectedPads.clear();
        allPads.forEach(pad => selectedPads.add(pad));
        lastClickedPad = allPads[0];
        cursorPad = allPads[allPads.length - 1];
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected();
        return;
    }

    // 7. Modals and Focus
    if (e.key.toLowerCase() === 'c') {
        e.preventDefault();
        showColorModal();
        return;
    }
    if (e.key.toLowerCase() === 'v') {
        e.preventDefault();
        velocityValueEl.focus();
        return;
    }

    // 8. Navigation and Shift-Selection Logic
    if (e.key.startsWith("Arrow")) {
        e.preventDefault();

        // Start from first pad if nothing is selected
        if (selectedPads.size === 0 || !cursorPad) {
            const first = allPads[0];
            selectedPads.add(first);
            lastClickedPad = first;
            cursorPad = first;
        } else {
            // Use cursorPad to track movement (prevents the "stopping" bug)
            let newRow = cursorPad.row;
            let newCol = cursorPad.col;

            if (e.key === "ArrowLeft") newCol = Math.max(0, cursorPad.col - 1);
            else if (e.key === "ArrowRight") newCol = Math.min(7, cursorPad.col + 1);
            else if (e.key === "ArrowUp") newRow = Math.min(7, cursorPad.row + 1);
            else if (e.key === "ArrowDown") newRow = Math.max(0, cursorPad.row - 1);

            const targetPad = allPads.find(p => p.row === newRow && p.col === newCol);

            if (targetPad) {
                cursorPad = targetPad; // Update our position tracker

                if (e.shiftKey && lastClickedPad) {
                    // Select range between anchor (lastClickedPad) and our current cursor
                    const startIdx = allPads.findIndex(p => p.note === lastClickedPad.note);
                    const endIdx = allPads.findIndex(p => p.note === targetPad.note);
                    const min = Math.min(startIdx, endIdx);
                    const max = Math.max(startIdx, endIdx);
                    
                    selectedPads.clear();
                    for (let i = min; i <= max; i++) {
                        selectedPads.add(allPads[i]);
                    }
                } else {
                    // Move single selection (anchor moves with cursor)
                    selectedPads.clear();
                    selectedPads.add(targetPad);
                    lastClickedPad = targetPad;
                }
            }
        }
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected();
        return;
    }

    // 9. Hotkeys: Quick Colors
    const k = e.key.toLowerCase();
    const hotkeyMap = { 'w': 8, 'r': 5, 'o': 9, 'y': 62, 'g': 21, 'b': 37, 'p': 49, '0': 0 };
    if (hotkeyMap.hasOwnProperty(k)) {
        currentVelocity = hotkeyMap[k];
        velocityValueEl.textContent = currentVelocity;
        applyColorToSelected(currentVelocity, true);
    }
}

    function handleModalKeyboard(e) {

            renderColorList();
            colorList.children[selectedColorIndex]?.scrollIntoView({ block: 'nearest' });

        }

    function savePreset() {
        const name = prompt("Enter a name for your preset:", "my_preset");
        if (name === null) return;
        const blob = new Blob([JSON.stringify(padStates, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        hideMenuModal();
    }

    function uploadPreset(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                Object.keys(data).forEach(note => {
                    const {row, col} = getRowColFromNote(parseInt(note));
                    updatePadVisual(row, col, data[note]);
                    sendNoteOn(parseInt(note), data[note]);
                });
                deselectAllPads();
            } catch (err) { alert("Invalid preset file."); }
        };
        reader.readAsText(file);
        hideMenuModal();
    }

    function recordHistory(changes) {
        // Clear any redo history if a new action is performed
        if (historyPointer < history.length - 1) {
            history = history.slice(0, historyPointer + 1);
        }

        history.push(changes);
        historyPointer++;

        // Trim history if it exceeds MAX_HISTORY_STEPS
        if (history.length > MAX_HISTORY_STEPS) {
            history.shift();
            historyPointer--;
        }
    }

function undo() {
        if (historyPointer < 0) return;

        const changes = history[historyPointer];
        changes.forEach(({ note, oldVelocity }) => {
            const { row, col } = getRowColFromNote(note);
            updatePadVisual(row, col, oldVelocity);
            sendNoteOn(note, oldVelocity);
        });
        historyPointer--;
        
        // Re-select pads that were part of the undo action
        selectedPads.clear();
        changes.forEach(({note}) => {
            const {row, col} = getRowColFromNote(note);
            selectedPads.add({row, col, note});
        });
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected(); // This will set currentVelocity and display
    }

    function redo() {
        if (historyPointer >= history.length - 1) return;

        historyPointer++;
        const changes = history[historyPointer];
        changes.forEach(({ note, newVelocity }) => {
            const { row, col } = getRowColFromNote(note);
            updatePadVisual(row, col, newVelocity);
            sendNoteOn(note, newVelocity);
        });
        
        // Re-select pads that were part of the redo action
        selectedPads.clear();
        changes.forEach(({note}) => {
            const {row, col} = getRowColFromNote(note);
            selectedPads.add({row, col, note});
        });
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected(); // This will set currentVelocity and display
    }


    function redo() {
        if (historyPointer >= history.length - 1) return;

        historyPointer++;
        const changes = history[historyPointer];
        changes.forEach(({ note, newVelocity }) => {
            const { row, col } = getRowColFromNote(note);
            updatePadVisual(row, col, newVelocity);
            sendNoteOn(note, newVelocity);
        });
        // Re-select pads that were part of the redo action (optional, for better UX)
        selectedPads.clear();
        changes.forEach(({note}) => {
            const {row, col} = getRowColFromNote(note);
            selectedPads.add({row, col, note});
        });
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected();
    }

                if (currentVelocity !== v && selectedPads.size > 0) {
                    const changes = Array.from(selectedPads).map(({ note }) => ({
                        note,
                        oldVelocity: padStates[note] || 0,
                        newVelocity: v
                    }));
                    recordHistory(changes);
                }
                currentVelocity = v;
                applyColorToSelected(v, false); // No need to record again
            } else {
                // If invalid, revert to previous valid value
                e.target.textContent = currentVelocity;

            updateVelocityDisplayForSelected();
