        :root {
            --bg: #0a0a0f;
            --panel: #16161f;
            --accent: #00ff9d; /* Changed accent color to a bright green for visibility */
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: #eee;
            font-family: 'Inter', system_ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none; /* Disable text selection for the entire page */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+ */
        }
        
        header {
            background: #111115;
            padding: 12px 24px; /* Slightly reduced padding */
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            margin: 0;
            font-size: 1.3rem; /* Slightly reduced font size */
            font-weight: 600;
        }
        
        .status {
            font-size: 0.7rem; /* Slightly reduced font size */
            padding: 5px 12px; /* Slightly reduced padding */
            background: #1f1f28;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .dot {
            width: 9px;
            height: 9px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .main {
            flex: 1;
            display: flex;
            gap: 20px; /* Reduced gap */
            padding: 20px; /* Reduced padding */
            overflow: hidden; /* Added to prevent main content scroll */
        }
        
        .launchpad-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111115;
            border-radius: 20px;
            position: relative;
        }
        
        .launchpad {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 9px;
            width: 560px;
            height: 560px;
            background: #0c0c12;
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 0 0 14px #1a1a22,
                        inset 0 0 80px rgba(0,0,0,0.9);
            user-select: none; 
        }
        
        .pad {
            width: 100%;
            height: 100%;
            background: #1a1a22;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: inset 0 6px 16px rgba(0,0,0,0.7),
                        0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            user-select: none;
            position: relative;
        }
        
        .pad.selected {
            transform: scale(0.92);
            z-index: 10;
        }
        
        .pad.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3.5px solid var(--accent);
            border-radius: 10px;
            opacity: 0.75;
            pointer-events: none;
        }

        .pad-label {
            position: absolute;
            pointer-events: none; 
            z-index: 1;
        }
        
        .sidebar {
            width: 300px; /* Slightly reduced width */
            background: var(--panel);
            border-radius: 20px;
            padding: 16px; /* Reduced padding */
            display: flex;
            flex-direction: column;
            gap: 5px; /* Reduced gap */
            overflow-y: auto; /* Keep overflow on sidebar itself */
            flex-shrink: 0; /* Prevent sidebar from shrinking */
        }
        
        .section {
            background: #111115;
            border-radius: 14px;
            padding: 14px; /* Reduced padding */
        }
        
        .section h3 {
            margin-top: -5px; /* Reduced top margin */
            margin-bottom: 5px; /* Adjusted bottom margin */
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .color-swatch-container {
            max-height: 130px; /* Roughly 3 rows of 42px swatches + gaps */
            overflow: auto;
            transition: max-height 0.3s ease-out;
            padding-bottom: 5px; /* Add some padding at the bottom */
        }
        
        .color-swatch-container.expanded {
            max-height: 500px; /* Large enough to show all colors */
        }

        .color-swatch {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(38px, 1fr)); /* Slightly smaller swatches */
            gap: 3px;
            justify-content: center; 
        }
        
        .swatch {
            width: 38px; /* Slightly smaller swatches */
            height: 38px; /* Slightly smaller swatches */
            border-radius: 8px; /* Slightly smaller border radius */
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); /* Adjusted shadow */
        }
        
        .swatch:hover {
            transform: scale(1.15); /* Slightly smaller hover scale */
        }
        
        .swatch.selected {
            box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); /* Adjusted shadow */
        }
        
        .hotkeys {
            padding: 8px 12px; /* Added some padding for the block */
            background: #22222a; /* Give it a background similar to the old key items */
            border-radius: 8px; /* Rounded corners */
            line-height: 1.4; /* Improve readability */
            font-size: 0.85rem; /* Base font size */
            color: #eee; /* Default text color */
        }
        
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 18px; /* Slightly reduced padding */
            border-radius: 9999px;
            font-weight: 600;
            margin-top: -5px;
            cursor: pointer;
            font-size: 0.9rem; /* Slightly reduced font size */
            transition: background 0.2s, transform 0.2s;
        }
        
        button:hover {
            background: #00ffaa;
            transform: scale(1.01);
        }

        .velocity-controls {
            display: flex;
            align-items: center;
            margin-top: 10px; /* Reduced margin */
            gap: 8px; /* Reduced gap */
        }

        .velocity-controls label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .velocity-controls button {
            padding: 6px 10px; /* Smaller buttons */
            font-size: 1.1em; /* Adjusted font size */
            border-radius: 6px; /* Smaller border radius */
            background: #333;
            color: #eee;
        }

        .velocity-controls button:hover {
            background: #555;
        }

        .velocity-value-editable {
            padding: 6px 10px; /* Smaller padding */
            border-radius: 6px; /* Smaller border radius */
            background-color: #1f1f28;
            border: 1px solid #333;
            color: #eee;
            font-size: 0.9em; /* Adjusted font size */
            outline: none;
            text-align: center;
            min-width: 35px; /* Ensure enough space */
            cursor: text;
            flex-grow: 1; /* Allow it to grow */
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--panel);
            padding: 20px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .modal-content input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #111115;
            color: #eee;
            font-size: 1em;
            outline: none;
        }

        .color-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .color-list-item {
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #222;
        }

        .color-list-item:last-child {
            border-bottom: none;
        }

        .color-list-item:hover, .color-list-item.selected {
            background-color: #22222a;
        }

        .color-preview {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>

</div>

        // Converts 0-7, 0-7 to 11-88

        return (row + 1) * 10 + (col + 1);
    }

    function getRowColFromNote(note) {
        const row = Math.floor(note / 10) - 1;
        const col = (note % 10) - 1;
        return { row, col };

    const velocityToColorMap = new Map(colorPalette.map(c => [c.v, c]));
    const allPads = []; // To store references to all pad elements in order

    function getColorByVelocity(velocity) {
        // Find exact match or closest known color for visual consistency
        if (velocityToColorMap.has(velocity)) {
            return velocityToColorMap.get(velocity);
        }
        
        // Fallback for velocities not explicitly defined: find the closest velocity with a defined color
        const sortedVelocities = Array.from(velocityToColorMap.keys()).sort((a, b) => a - b);
        let closest = sortedVelocities[0];
        for (const v of sortedVelocities) {
            if (Math.abs(v - velocity) < Math.abs(closest - velocity)) {
                closest = v;
            }
        }
        return velocityToColorMap.get(closest);
    }

    let midiAccess = null;
    let output = null;
    let input = null;
    let selectedPads = new Set();
    let currentVelocity = 64;
    let padStates = {}; // Stores the last known velocity for each pad

    let launchpadEl, swatchesEl, hotkeysDisplayEl, velocityDownButton, velocityUpButton, velocityValueEl;
    let colorModal, colorSearchInput, colorList;
    let filteredColors = [];
    let selectedColorIndex = -1;
    let lastClickedPad = null; // For shift-click range selection
    let swatchContainer;
    let togglePaletteButton;
    let midiStatusEl;


    function log(msg, type = "info") {
        // Activity log removed, but keeping this function as a placeholder if needed later.
        // console.log(`[${type.toUpperCase()}] ${msg}`);
    }

    async function requestMIDIAccess() {
        if (!navigator.requestMIDIAccess) {
            midiStatusEl.textContent = "Web MIDI not supported. Please use Chrome or Edge.";
            return;
        }
        try {
            midiAccess = await navigator.requestMIDIAccess({sysex: false});
            
            const outputs = Array.from(midiAccess.outputs.values());
            const inputs = Array.from(midiAccess.inputs.values());

            output = outputs.find(o => o.name.toLowerCase().includes("launchpad")) || outputs[0];
            input = inputs.find(i => i.name.toLowerCase().includes("launchpad")) || inputs[0];

            let statusText = "MIDI ready";
            if (output) statusText += ` • Out: ${output.name}`;
            if (input) {
                statusText += ` • In: ${input.name}`;
                input.onmidimessage = handleMIDIMessage;
            }
            if (!output && !input) statusText += " (No Launchpad found)";
            
            midiStatusEl.textContent = statusText;

        } catch (err) {
            midiStatusEl.textContent = `MIDI Error: ${err.message}`;
        }
    }

    function sendNoteOn(note, velocity) {
        if (!output) return false;
        try {
            output.send([0x90 | (MIDI_CHANNEL - 1), note, velocity]);
            return true;
        } catch (e) {
            console.error(e);
            return false;
        }
    }

    function updatePadVisual(row, col, velocity) {
        const pad = document.querySelector(`.pad[data-row="${row}"][data-col="${col}"]`);
        if (!pad) return;

        const color = getColorByVelocity(velocity);
        
        pad.style.backgroundColor = color.hex;
        // Adjust box shadow for black (0 velocity) pads
        if (velocity === 0) {
            pad.style.boxShadow = `inset 0 6px 16px rgba(0,0,0,0.7), 0 4px 10px rgba(0,0,0,0.5)`;
            pad.querySelector('.pad-label').style.color = 'rgba(255,255,255,0.25)';
        } else {
            pad.style.boxShadow = `inset 0 6px 16px rgba(0,0,0,0.8), 0 0 25px ${color.hex}33`;
            pad.querySelector('.pad-label').style.color = 'rgba(255,255,255,0.75)';
        }
        padStates[getNote(row, col)] = velocity;
    }

    function createLaunchpad() {
        launchpadEl = document.getElementById("launchpad");
        launchpadEl.innerHTML = "";
        allPads.length = 0; // Clear previous pads

        for (let row = 7; row >= 0; row--) { // Rows 7 down to 0
            for (let col = 0; col < 8; col++) { // Cols 0 to 7
                const pad = document.createElement("div");
                pad.className = "pad";
                pad.dataset.row = row;
                pad.dataset.col = col;

                const label = document.createElement("span");
                label.className = "pad-label";
                label.textContent = getNote(row, col);
                pad.appendChild(label);

                pad.addEventListener("click", (e) => handlePadClick(row, col, e));

                updatePadVisual(row, col, 0); // Initialize with black
                launchpadEl.appendChild(pad);
                allPads.push({ element: pad, row, col, note: getNote(row, col) });
            }
        }
    }

    function handlePadClick(row, col, e) {
        const note = getNote(row, col);
        const currentPad = {row, col, note};

        if (e.ctrlKey || e.metaKey) { // Multi-selection/toggle
            const exists = Array.from(selectedPads).some(p => p.row === row && p.col === col);
            if (exists) {
                selectedPads = new Set(Array.from(selectedPads).filter(p => !(p.row === row && p.col === col)));
            } else {
                selectedPads.add(currentPad);
            }
            lastClickedPad = currentPad;
        } else if (e.shiftKey && lastClickedPad) { // Range selection in order
            const startIdx = allPads.findIndex(p => p.row === lastClickedPad.row && p.col === lastClickedPad.col);
            const endIdx = allPads.findIndex(p => p.row === row && p.col === col);

            if (startIdx !== -1 && endIdx !== -1) {
                // Find the current min/max indices of selected pads for extending
                // If no pads selected, treat lastClickedPad as the only anchor
                let currentMinIdx = startIdx; 
                let currentMaxIdx = startIdx;

                if (selectedPads.size > 0) {
                    const currentSelectedNotes = Array.from(selectedPads).map(p => p.note);
                    const sortedSelectedIndices = Array.from(selectedPads).map(p => allPads.findIndex(ap => ap.note === p.note)).sort((a,b) => a-b);
                    currentMinIdx = sortedSelectedIndices[0];
                    currentMaxIdx = sortedSelectedIndices[sortedSelectedIndices.length - 1];
                }

                let newMinIdx = currentMinIdx;
                let newMaxIdx = currentMaxIdx;

                // Extend based on the direction of movement from the 'last clicked' pad
                if (endIdx < currentMinIdx) { // Moving left/up from current selection
                    newMinIdx = Math.min(endIdx, startIdx); // Also consider startIdx if it's new
                    newMaxIdx = Math.max(currentMaxIdx, startIdx);
                } else if (endIdx > currentMaxIdx) { // Moving right/down from current selection
                    newMinIdx = Math.min(currentMinIdx, startIdx);
                    newMaxIdx = Math.max(endIdx, startIdx);
                } else { // Target is within or overlaps existing selection
                    // This complex case is simplified for user experience:
                    // If moving within the existing range, or starting a new range with shift,
                    // re-calculate based on lastClickedPad and target.
                    // For a clean extension, if moving beyond current min/max, extend.
                    // If moving within, re-anchor from the closest of the two ends.
                    const absDiffToMin = Math.abs(endIdx - currentMinIdx);
                    const absDiffToMax = Math.abs(endIdx - currentMaxIdx);

                    if (absDiffToMin < absDiffToMax) { // Target is closer to min, extend/contract from min
                        newMinIdx = endIdx;
                        newMaxIdx = currentMaxIdx;
                    } else { // Target is closer to max, extend/contract from max
                        newMinIdx = currentMinIdx;
                        newMaxIdx = endIdx;
                    }
                }

                selectedPads.clear();
                for (let i = Math.min(newMinIdx, newMaxIdx); i <= Math.max(newMinIdx, newMaxIdx); i++) {
                    selectedPads.add(allPads[i]);
                }
            }
            lastClickedPad = currentPad; // Update last clicked for potential chaining
        } else { // Single selection
            selectedPads.clear();
            selectedPads.add(currentPad);
            lastClickedPad = currentPad;
        }

        refreshSelectionVisuals();
        updateVelocityDisplayForSelected();
    }

    function deselectAllPads() {
        selectedPads.clear();
        lastClickedPad = null;
        refreshSelectionVisuals();
        updateVelocityDisplayForSelected(); // Update velocity display
    }

    // Dedicated handler for clicks on the container background
    function deselectAllOnContainerClick(e) {
        // Check if the click target is the container itself or the launchpad grid, but not a pad
        const isClickOnContainer = e.target.id === 'launchpad-container' || e.target.id === 'launchpad';
        const isClickOnPad = e.target.closest('.pad'); // Check if click is inside a pad

        if (isClickOnContainer && !isClickOnPad && e.button === 0) { // Only deselect on left-click
            deselectAllPads();
        }
    }

    function refreshSelectionVisuals() {
        document.querySelectorAll('.pad').forEach(pad => {
            const r = parseInt(pad.dataset.row);
            const c = parseInt(pad.dataset.col);
            const isSelected = Array.from(selectedPads).some(s => s.row === r && s.col === c);
            pad.classList.toggle('selected', isSelected);

            // Update label color for blacked out pads
            const currentPadNote = getNote(r, c);
            const currentVel = padStates[currentPadNote] || 0;
            pad.querySelector('.pad-label').style.color = (currentVel === 0) ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.75)';
        });
    }

    function updateVelocityDisplayForSelected() {
        if (selectedPads.size === 1) {
            const { note } = Array.from(selectedPads)[0];
            const velocity = padStates[note] || 0;
            currentVelocity = velocity;
            velocityValueEl.textContent = currentVelocity;
        } else if (selectedPads.size > 0) { // If multiple pads are selected, display the velocity of the first selected
            const firstSelectedNote = Array.from(selectedPads)[0].note;
            currentVelocity = padStates[firstSelectedNote] || 0;
            velocityValueEl.textContent = currentVelocity;
        } else {
            currentVelocity = 0; // Set to 0 or blank when no pads are selected
            velocityValueEl.textContent = ''; // Blank when nothing is selected
        }
    }

    function applyColorToSelected(velocity) {
        if (selectedPads.size === 0) return;
        
        selectedPads.forEach(({row, col, note}) => {
            updatePadVisual(row, col, velocity);
            sendNoteOn(note, velocity);
        });
    }

    function clearSelected() {
        if (selectedPads.size === 0) return;
        
        selectedPads.forEach(({row, col, note}) => {
            updatePadVisual(row, col, 0);
            sendNoteOn(note, 0);
        });
        
        deselectAllPads(); // Clear selection after clearing pads
    }

    function clearAll() {
        if (!confirm("Clear ALL 64 pads?")) return;
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                updatePadVisual(r, c, 0);
                sendNoteOn(getNote(r, c), 0);
            }
        }
        
        deselectAllPads(); // Clear selection after clearing all pads
    }

    function applyCustomRainbow() {
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const velocity = customRainbow[col % customRainbow.length];
                updatePadVisual(row, col, velocity);
                sendNoteOn(getNote(row, col), velocity);
            }
        }
        
        deselectAllPads(); // Clear selection after applying rainbow
    }

    function handleMIDIMessage(e) {
        const [status, note, velocity] = e.data;
        // Pad notes 11-18, 21-28, ..., 81-88
        const isPadNote = (note >= 11 && note <= 18) || 
                         (note >= 21 && note <= 28) || 
                         (note >= 31 && note <= 38) || 
                         (note >= 41 && note <= 48) || 
                         (note >= 51 && note <= 58) || 
                         (note >= 61 && note <= 68) || 
                         (note >= 71 && note <= 78) || 
                         (note >= 81 && note <= 88);

        if ((status & 0xF0) === 0x90 && isPadNote) { // Only note on/off for actual pads
            const { row, col } = getRowColFromNote(note);
            
            if (velocity > 0) { // Note On
                selectedPads.clear();
                selectedPads.add({row, col, note});
                lastClickedPad = {row, col, note};
                refreshSelectionVisuals();
                updateVelocityDisplayForSelected(); // Update velocity from hardware input
            } else { // Note Off
                // If you want to clear selection on note off, add logic here.
                // For now, it remains selected until another action.
            }
        }
    }

    function handleKeyboard(e) {
        if (colorModal.style.display === 'flex') {
            handleModalKeyboard(e);
            return;
        }

        if (e.key === "Escape") {
            deselectAllPads();
            return;
        }

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            selectedPads.clear();
            allPads.forEach(pad => selectedPads.add(pad));
            lastClickedPad = allPads[allPads.length - 1]; // Set last clicked to the last pad
            refreshSelectionVisuals();
            updateVelocityDisplayForSelected();
            return;
        }

        if (e.key.toLowerCase() === 'c') {
            e.preventDefault(); // Prevent 'c' from being typed into search bar
            showColorModal();
            return;
        }

        if (e.key.toLowerCase() === 'v') {
            e.preventDefault();
            velocityValueEl.focus();
            return;
        }


        if (selectedPads.size === 0) {
            // If no pads selected, allow arrow keys to select the first pad
            if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
                e.preventDefault();
                if (allPads.length > 0) {
                    selectedPads.add(allPads[0]); // Select the first pad (row 7, col 0)
                    lastClickedPad = allPads[0];
                    refreshSelectionVisuals();
                    updateVelocityDisplayForSelected();
                }
            }
            return; // Prevent further actions if no pads are selected, unless it's a selection action
        }

        const k = e.key.toLowerCase();
        let vel = null;
        let currentPad = Array.from(selectedPads)[0]; // Use the first selected pad for navigation basis
        let newRow = currentPad.row;
        let newCol = currentPad.col;
        let targetPad = null;
        let changedSelection = false;

        if (e.metaKey || e.ctrlKey) { // Command/Ctrl key for velocity changes
            if (e.key === "ArrowUp") {
                e.preventDefault();
                currentVelocity = Math.min(127, currentVelocity + 1);
                velocityValueEl.textContent = currentVelocity;
                applyColorToSelected(currentVelocity);
                return;
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                currentVelocity = Math.max(0, currentVelocity - 1);
                velocityValueEl.textContent = currentVelocity;
                applyColorToSelected(currentVelocity);
                return;
            }
        }

        // Arrow key navigation and Shift-selection
        if (e.key === "ArrowLeft") {
            e.preventDefault();
            newCol = Math.max(0, currentPad.col - 1);
            targetPad = allPads.find(p => p.row === newRow && p.col === newCol);
            changedSelection = true;
        } else if (e.key === "ArrowRight") {
            e.preventDefault();
            newCol = Math.min(7, currentPad.col + 1);
            targetPad = allPads.find(p => p.row === newRow && p.col === newCol);
            changedSelection = true;
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            newRow = Math.min(7, currentPad.row + 1); // Launchpad rows go up
            targetPad = allPads.find(p => p.row === newRow && p.col === newCol);
            changedSelection = true;
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            newRow = Math.max(0, currentPad.row - 1); // Launchpad rows go down
            targetPad = allPads.find(p => p.row === newRow && p.col === newCol);
            changedSelection = true;
        }

        if (changedSelection && targetPad) {
            if (e.shiftKey) {
                const startIdx = allPads.findIndex(p => p.row === lastClickedPad.row && p.col === lastClickedPad.col);
                const endIdx = allPads.findIndex(p => p.row === targetPad.row && p.col === targetPad.col);

                if (startIdx !== -1 && endIdx !== -1) {
                    const currentMinNote = Math.min(...Array.from(selectedPads).map(p => p.note));
                    const currentMaxNote = Math.max(...Array.from(selectedPads).map(p => p.note));
                    const currentMinIdx = allPads.findIndex(p => p.note === currentMinNote);
                    const currentMaxIdx = allPads.findIndex(p => p.note === currentMaxNote);

                    let newMinIdx, newMaxIdx;

                    // Logic to extend selection:
                    // If the target is outside the current range, extend the range to include it.
                    // If the target is inside the current range, adjust the end closest to the target.
                    if (endIdx < currentMinIdx) { // Moving left/up beyond current selection
                        newMinIdx = endIdx;
                        newMaxIdx = currentMaxIdx;
                    } else if (endIdx > currentMaxIdx) { // Moving right/down beyond current selection
                        newMinIdx = currentMinIdx;
                        newMaxIdx = endIdx;
                    } else { // Target is within the current selection. Adjust the end closest to the target.
                        if (Math.abs(endIdx - currentMinIdx) < Math.abs(endIdx - currentMaxIdx)) {
                            newMinIdx = endIdx; // Target is closer to min, so extend/contract from min side
                            newMaxIdx = currentMaxIdx;
                        } else {
                            newMinIdx = currentMinIdx; // Target is closer to max, so extend/contract from max side
                            newMaxIdx = endIdx;
                        }
                    }

                    selectedPads.clear();
                    for (let i = Math.min(newMinIdx, newMaxIdx); i <= Math.max(newMinIdx, newMaxIdx); i++) {
                        selectedPads.add(allPads[i]);
                    }
                }
                lastClickedPad = targetPad; 
            } else {
                selectedPads.clear();
                selectedPads.add(targetPad);
                lastClickedPad = targetPad;
            }
            refreshSelectionVisuals();
            updateVelocityDisplayForSelected();
            return;
        }


        // Hotkeys based on new palette
        if (k === 'w') vel = 8; // Warm White
        else if (k === 'r') vel = 5; // Red
        else if (k === 'o') vel = 9; // Orange
        else if (k === 'y') vel = 62; // Yellow
        else if (k === 'g') vel = 21; // Green
        else if (k === 'b') vel = 37; // Sky Blue
        else if (k === 'p') vel = 49; // Light Purple
        else if (k === '0') vel = 0; // Off

        if (vel !== null) {
            currentVelocity = vel;
            velocityValueEl.textContent = currentVelocity;
            applyColorToSelected(currentVelocity);
        }
    }

    function createSwatches() {
        swatchesEl = document.getElementById("swatches");
        swatchesEl.innerHTML = "";

        colorPalette.filter(c => c.v !== 0).forEach(c => {
            const sw = document.createElement("div");
            sw.className = "swatch";
            sw.style.backgroundColor = c.hex;
            sw.title = `Velocity ${c.v}: ${c.name}`;

            sw.addEventListener("click", () => {
                currentVelocity = c.v;
                velocityValueEl.textContent = currentVelocity;
                applyColorToSelected(currentVelocity);
            });
            swatchesEl.appendChild(sw);
        });
    }

    function createHotkeysDisplay() {
        hotkeysDisplayEl = document.getElementById("hotkeys-display");
        hotkeysDisplayEl.innerHTML = ""; // Clear existing

        const hotkeysData = [ // Renamed for clarity, same data
            { key: 'W', name: 'White' },
            { key: 'R', name: 'Red' },
            { key: 'O', name: 'Orange' },
            { key: 'Y', name: 'Yellow' },
            { key: 'G', name: 'Green' },
            { key: 'B', name: 'Blue' },
            { key: 'P', name: 'Purple' },
            { key: '0', name: 'Off' }
        ];

        // Build a single string for the hotkeys text block
        const hotkeysText = hotkeysData.map(hk => `${hk.key} - ${hk.name}`).join('<br>');

        const textBlock = document.createElement("div");
        textBlock.className = "hotkeys-text-block"; // New class for styling
        textBlock.innerHTML = hotkeysText; // Insert the combined text
        hotkeysDisplayEl.appendChild(textBlock); // Append the single block
    }

    // Color Search Modal Functions
    function showColorModal() {
        colorModal.style.display = 'flex';
        colorSearchInput.value = '';
        filterColors();
        colorSearchInput.focus();
        selectedColorIndex = (filteredColors.length > 0) ? 0 : -1; // Select first item by default
        renderColorList();
    }

    function hideColorModal() {
        colorModal.style.display = 'none';
        selectedColorIndex = -1;
    }

    function filterColors() {
        const query = colorSearchInput.value.toLowerCase();
        filteredColors = colorPalette.filter(c => 
            c.name.toLowerCase().includes(query) || c.v.toString().includes(query)
        );
        selectedColorIndex = (filteredColors.length > 0) ? 0 : -1; // Select first item if any, otherwise -1
        renderColorList();
    }

    function renderColorList() {
        colorList.innerHTML = '';
        if (filteredColors.length === 0) {
            const noResults = document.createElement('div');
            noResults.textContent = 'No matching colors.';
            noResults.style.padding = '10px';
            noResults.style.opacity = '0.7';
            colorList.appendChild(noResults);
            return;
        }

        filteredColors.forEach((color, index) => {
            const item = document.createElement('div');
            item.className = 'color-list-item';
            if (index === selectedColorIndex) {
                item.classList.add('selected');
            }
            item.dataset.velocity = color.v;

            const preview = document.createElement('div');
            preview.className = 'color-preview';
            preview.style.backgroundColor = color.hex;
            item.appendChild(preview);

            const text = document.createElement('span');
            text.textContent = `${color.name} (v${color.v})`;
            item.appendChild(text);

            item.addEventListener('click', () => {
                selectColorFromModal(color.v);
            });
            colorList.appendChild(item);
        });

        if (selectedColorIndex >= 0 && filteredColors[selectedColorIndex]) {
            const selectedElement = colorList.children[selectedColorIndex];
            if (selectedElement) {
                selectedElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }
    }

    function selectColorFromModal(velocity) {
        currentVelocity = velocity;
        velocityValueEl.textContent = currentVelocity;
        applyColorToSelected(currentVelocity);
        hideColorModal();
    }

    function handleModalKeyboard(e) {
        if (e.key === "Escape") {
            hideColorModal();
            e.preventDefault();
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            selectedColorIndex = (selectedColorIndex + 1) % filteredColors.length;
            if (selectedColorIndex < 0) selectedColorIndex = filteredColors.length - 1; // Wrap around upwards
            renderColorList();
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            selectedColorIndex = (selectedColorIndex - 1 + filteredColors.length) % filteredColors.length;
            if (selectedColorIndex < 0) selectedColorIndex = filteredColors.length - 1; // Wrap around downwards
            renderColorList();
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (selectedColorIndex >= 0 && filteredColors.length > 0) {
                selectColorFromModal(filteredColors[selectedColorIndex].v);
            }
        }
    }

    function init() {
        createLaunchpad();
        createSwatches();
        createHotkeysDisplay();

        midiStatusEl = document.getElementById("midi-status");
        velocityDownButton = document.getElementById("velocity-down");
        velocityUpButton = document.getElementById("velocity-up");
        velocityValueEl = document.getElementById("velocity-value");
        swatchContainer = document.getElementById("swatch-container");
        togglePaletteButton = document.getElementById("togglePalette");
        
        colorModal = document.getElementById("colorModal");
        colorSearchInput = document.getElementById("colorSearchInput");
        colorList = document.getElementById("colorList");
        const launchpadContainer = document.getElementById('launchpad-container');

        // Velocity value editing
        velocityValueEl.addEventListener('focus', (e) => {
            // If it's blank, don't clear. If it has a value, select it for easy overwriting.
            if (e.target.textContent !== '') {
                document.execCommand('selectAll', false, null);
            }
        });
        velocityValueEl.addEventListener('keydown', (e) => {
            const textContent = e.target.textContent;

            // Allow numbers, backspace, delete, and arrow keys
            if (
                !/[0-9]/.test(e.key) && // Not a number
                e.key !== 'Backspace' &&
                e.key !== 'Delete' &&
                !e.key.startsWith('Arrow') &&
                e.key !== 'Enter' // Allow Enter to submit
            ) {
                e.preventDefault(); // Prevent non-numeric characters
            }

            // Prevent more than X digits, unless it's backspace/delete
            // CHANGE THIS LINE:
            if (textContent.length >= 4 && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key === "Enter") {
                e.preventDefault();
                e.target.blur(); // Trigger blur to save
            }
        });
        
velocityValueEl.addEventListener('blur', (e) => {
            let newVel = parseInt(e.target.textContent);
            if (!isNaN(newVel) && newVel >= 0 && newVel <= 127) { // This line still enforces 0-127
                currentVelocity = newVel;
                e.target.textContent = currentVelocity; 
                applyColorToSelected(currentVelocity);
            } else if (e.target.textContent === '') { 
                currentVelocity = 0; 
                applyColorToSelected(currentVelocity);
            }
            else {
                e.target.textContent = selectedPads.size > 0 ? currentVelocity : ''; 
            }
            updateVelocityDisplayForSelected();
        });


        colorSearchInput.addEventListener('input', filterColors);
        colorModal.addEventListener('click', (e) => {
            if (e.target === colorModal) { // Clicked outside modal content
                hideColorModal();
            }
        });

        velocityDownButton.addEventListener("click", () => {
            currentVelocity = Math.max(0, currentVelocity - 1);
            velocityValueEl.textContent = currentVelocity;
            if (selectedPads.size > 0) applyColorToSelected(currentVelocity);
        });

        velocityUpButton.addEventListener("click", () => {
            currentVelocity = Math.min(127, currentVelocity + 1);
            velocityValueEl.textContent = currentVelocity;
            if (selectedPads.size > 0) applyColorToSelected(currentVelocity);
        });

        togglePaletteButton.addEventListener("click", () => {
            swatchContainer.classList.toggle("expanded");
            togglePaletteButton.textContent = swatchContainer.classList.contains("expanded") ? "Hide" : "Show All";
        });

        document.addEventListener("keydown", handleKeyboard);
        launchpadContainer.addEventListener('click', deselectAllOnContainerClick); // Re-added here for initial setup
        document.body.addEventListener('click', deselectAllOnContainerClick); // Also listen on body for general background click

        requestMIDIAccess(); // Auto-connect on load
        updateVelocityDisplayForSelected(); // Initialize velocity display correctly on load (blank)
    }

    window.onload = init;
</script>
