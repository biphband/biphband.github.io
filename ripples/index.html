<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple MIDI Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            overflow: hidden;
            touch-action: none;
            cursor: none;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* MIDI Selection Modal */
        #midi-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        
        #midi-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .modal-content {
            background: #111;
            padding: 40px 50px;
            border-radius: 16px;
            border: 1px solid #333;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        
        .modal-content h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #FF00FF;
        }
        
        .modal-content p {
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        select {
            width: 100%;
            padding: 14px 16px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
        }
        
        select:focus {
            border-color: #FF00FF;
        }
        
        button {
            background: #FF00FF;
            color: #000;
            font-weight: 700;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #CC00FF;
            transform: scale(1.03);
        }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- MIDI Selection Modal -->
    <div id="midi-modal">
        <div class="modal-content">
            <h1>🌊 Ripple MIDI Visualizer</h1>
            <p>Choose your MIDI output device.<br>Default is usually <strong>IAC Driver Bus 1</strong> (macOS) or similar virtual bus.</p>
            
            <select id="midi-select"></select>
            
            <button id="connect-btn">Connect & Start Visualizer</button>
            
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        // ============== CONFIG ==============
        const COLORS = [
            '#FF4500', '#FFEA00', '#BFFF00', '#00FF66',
            '#00FFFF', '#6600FF', '#CC00FF', '#FF00FF'
        ];
        
        const MIDI_NOTE_VELOCITY = 99;
        const RIPPLE_LIFE_MS = 2100;
        const RIPPLE_SPEED_PPS = 180;
        const IDLE_RIPPLE_SPEED_PPS = 160;
        const IDLE_RIPPLE_LIFE_MS = 3800;
        const IDLE_INTENSITY = 0.085;
        const IDLE_INTERVAL_MS = 2450;
        const DRAG_THROTTLE_MS = 1;

        // ============== SETUP ==============
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // State
        let ripples = [];
        let currentColorIndex = 0;
        let lastColor = COLORS[0];
        let hasInteracted = false;
        let midiOutput = null;
        let isDragging = false;
        let lastDragRippleTime = 0;
        let lastIdleTime = Date.now();

        // ============== MIDI ==============
        let midiAccess = null;

        async function initMIDI() {
            if (!navigator.requestMIDIAccess) {
                showStatus('Web MIDI not supported in this browser', 'error');
                return null;
            }

            try {
                midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                return Array.from(midiAccess.outputs.values());
            } catch (err) {
                showStatus('MIDI access denied or unavailable', 'error');
                return null;
            }
        }

        function populateMidiSelect(outputs) {
            const select = document.getElementById('midi-select');
            select.innerHTML = '';

            if (!outputs || outputs.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = 'No MIDI outputs found';
                opt.disabled = true;
                select.appendChild(opt);
                return;
            }

            // Try to find a sensible default (IAC Driver Bus 1 or similar)
            let defaultIndex = -1;
            outputs.forEach((output, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = output.name;
                select.appendChild(opt);

                const name = output.name.toLowerCase();
                if (defaultIndex === -1 && 
                    (name.includes('iac') || name.includes('bus 1') || name.includes('virtual') || name.includes('loopmidi'))) {
                    defaultIndex = i;
                }
            });

            if (defaultIndex !== -1) {
                select.value = defaultIndex;
            }
        }

        function connectSelectedMidi() {
            const select = document.getElementById('midi-select');
            const outputs = Array.from(midiAccess.outputs.values());
            const selectedIndex = parseInt(select.value);

            if (isNaN(selectedIndex) || !outputs[selectedIndex]) {
                showStatus('Please select a valid MIDI output', 'error');
                return;
            }

            midiOutput = outputs[selectedIndex];
            console.log(`%c✅ MIDI connected → ${midiOutput.name}`, 'color:#00FF66;font-weight:700');

            // Hide modal and start visualizer
            document.getElementById('midi-modal').classList.add('hidden');
            startVisualizer();
        }

        function showStatus(msg, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = msg;
            statusEl.style.color = type === 'error' ? '#FF4500' : '#FFEA00';
        }

        function sendMIDINote(noteNumber) {
            if (!midiOutput) return;
            
            midiOutput.send([0x90, noteNumber, MIDI_NOTE_VELOCITY]);
            
            setTimeout(() => {
                if (midiOutput) midiOutput.send([0x80, noteNumber, 0]);
            }, 100);
        }

        // ============== RIPPLE SYSTEM ==============
        class Ripple {
            constructor(x, y, color, intensity, speed, life) {
                this.x = x; this.y = y; this.color = color;
                this.intensity = intensity; this.speed = speed; this.life = life;
                this.birth = Date.now();
            }
            getAge() { return Date.now() - this.birth; }
            isDead() { return this.getAge() > this.life; }
            getProgress() { return Math.min(this.getAge() / this.life, 1); }
            getRadius() { return 8 + (this.getAge() / 1000) * this.speed; }
            getAlpha() {
                const progress = this.getProgress();
                return (1 - Math.pow(progress, 1.6)) * this.intensity;
            }
        }

        function createRipple(x, y, color, intensity = 1, speed = RIPPLE_SPEED_PPS, life = RIPPLE_LIFE_MS) {
            ripples.push(new Ripple(x, y, color, intensity, speed, life));
        }

        // ============== ANIMATION LOOP ==============
        function animate() {
            const now = Date.now();
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.13)';
            ctx.fillRect(0, 0, width, height);
            
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                if (r.isDead()) {
                    ripples.splice(i, 1);
                    continue;
                }
                
                const radius = r.getRadius();
                const alpha = r.getAlpha();
                
                ctx.shadowBlur = 22;
                ctx.shadowColor = r.color;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = r.color;
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                
                ctx.shadowBlur = 0;
            }
            
            // Idle ripples
            if (hasInteracted && now - lastIdleTime > IDLE_INTERVAL_MS) {
                const idleX = Math.random() * width;
                const idleY = Math.random() * height;
                createRipple(idleX, idleY, lastColor, IDLE_INTENSITY, IDLE_RIPPLE_SPEED_PPS, IDLE_RIPPLE_LIFE_MS);
                lastIdleTime = now;
            }
            
            requestAnimationFrame(animate);
        }

        // ============== INTERACTION ==============
        function handleClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const color = COLORS[currentColorIndex];
            createRipple(x, y, color, 1, RIPPLE_SPEED_PPS, RIPPLE_LIFE_MS);
            lastColor = color;
            
            const noteNumber = currentColorIndex + 1; // 1-8
            sendMIDINote(noteNumber);
            
            currentColorIndex = (currentColorIndex + 1) % COLORS.length;
            hasInteracted = true;
        }

        function startDrag() { isDragging = true; }
        function handleDrag(e) {
            if (!isDragging) return;
            const now = Date.now();
            if (now - lastDragRippleTime < DRAG_THROTTLE_MS) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            createRipple(x, y, lastColor, 0.95, RIPPLE_SPEED_PPS * 0.9, RIPPLE_LIFE_MS * 0.85);
            lastDragRippleTime = now;
        }
        function endDrag() { isDragging = false; }

        function addListeners() {
            canvas.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                startDrag();
                handleClick(e);
            });
            
            canvas.addEventListener('pointermove', handleDrag);
            canvas.addEventListener('pointerup', endDrag);
            canvas.addEventListener('pointerleave', endDrag);
            canvas.addEventListener('pointercancel', endDrag);

            // Keyboard fallback
            document.addEventListener('keydown', (e) => {
                if (!hasInteracted) {
                    const fakeEvent = { clientX: width / 2, clientY: height / 2 };
                    startDrag();
                    handleClick(fakeEvent);
                    endDrag();
                }
            });
        }

        // ============== START VISUALIZER (after MIDI choice) ==============
        function startVisualizer() {
            console.log('%c🌊 Ripple MIDI Visualizer ready', 'color:#FF00FF;font-size:13px;font-weight:700');
            console.log(`→ MIDI output: ${midiOutput ? midiOutput.name : 'None (visuals only)'}`);
            console.log('→ Click or drag anywhere. Colors cycle through 8 vibrant hues.');

            addListeners();
            animate();

            // Gentle starting ripple
            setTimeout(() => {
                createRipple(width * 0.3, height * 0.4, COLORS[0], IDLE_INTENSITY * 1.4, IDLE_RIPPLE_SPEED_PPS * 0.5, IDLE_RIPPLE_LIFE_MS);
            }, 600);
        }

        // ============== MAIN START ==============
        async function start() {
            const outputs = await initMIDI();
            populateMidiSelect(outputs);
            
            document.getElementById('connect-btn').addEventListener('click', connectSelectedMidi);
            
            // Auto-connect if only one output exists (optional quality-of-life)
            if (outputs && outputs.length === 1) {
                setTimeout(() => {
                    document.getElementById('midi-select').value = 0;
                    connectSelectedMidi();
                }, 800);
            }
        }

        // Launch
        start();
    </script>
</body>
</html>
