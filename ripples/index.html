<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple MIDI Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            overflow: hidden;
            touch-action: none;
            cursor: none;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ===================== SPLASH SCREEN ===================== */
        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            opacity: 0;
            transition: opacity 5s ease-in-out;
        }

        /* Top Section */
        .top-section {
            text-align: center;
            padding-top: 4vh;
            flex-shrink: 0;
        }

        .top-text p {
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 6px 0;
        }

        #bibscaf-title {
            font-family: 'Poppins', sans-serif;
            font-size: 7.8vw;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 0.88;
            margin: 12px 0 18px 0;
            background: linear-gradient(90deg, 
                #ff00ff, #00ffff, #ffff00, #00ff88, 
                #ff00ff, #00ffff, #ffff00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 280% 280%;
            animation: iridescentShift 7s ease-in-out infinite;
            text-shadow: 
                0 0 40px rgba(255,255,255,0.7),
                0 0 80px rgba(255,0,255,0.5);
            -webkit-text-stroke: 3px rgba(255,255,255,0.15);
        }

        @keyframes iridescentShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        #bibscaf-title::after {
            content: 'Iridescence';
            display: block;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 2.4vw;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 7px;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 0 25px rgba(255,255,255,0.8);
        }

        /* Center - Touch Anywhere (always centered) */
        .center-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .touch-block {
            width: 540px;
            max-width: 88vw;
            height: 190px;
            background: rgba(240, 240, 240, 0.133);
            backdrop-filter: blur(14px);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.18);
            box-shadow: 0 25px 70px rgba(0,0,0,0.65);
            position: relative;
            overflow: hidden;
        }

        .touch-block::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shine 5.5s linear infinite;
        }

        .touch-text {
            font-family: 'Poppins', sans-serif;
            font-size: 2.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: transparent;
            -webkit-text-fill-color: transparent;
            background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,0.75));
            -webkit-background-clip: text;
            background-clip: text;
            text-align: center;
            text-shadow: 0 0 30px rgba(255,255,255,0.95);
        }

        /* Bottom Credit */
        .bottom-section {
            text-align: center;
            padding-bottom: 4vh;
            flex-shrink: 0;
        }

        .bottom-credit {
            font-family: 'Inter', sans-serif;
            font-size: 0.84rem;
            color: rgba(255,255,255,0.68);
            letter-spacing: 2.5px;
        }

        @keyframes shine {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(220%); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- SPLASH SCREEN -->
    <div id="splash">
        <!-- Top Section -->
        <div class="top-section">
            <div class="top-text">
                <p>BIPH Art Department</p>
                <p>Proudly Presents</p>
            </div>
            <div id="bibscaf-title">
                BIBSCAF
            </div>
        </div>

        <!-- Center - Always centered Touch Anywhere -->
        <div class="center-section">
            <div class="touch-block">
                <div class="touch-text">Touch Anywhere</div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="bottom-section">
            <div class="bottom-credit">
                Interactive lighting installation by Mr. Tubbs' Production Tech class
            </div>
        </div>
    </div>

    <script>
        // ============== CONFIG ==============
        const COLORS = [
            '#FF4500', '#FFEA00', '#BFFF00', '#00FF66',
            '#00FFFF', '#6600FF', '#CC00FF', '#FF00FF'
        ];
        
        const MIDI_NOTE_VELOCITY = 99;
        const RIPPLE_LIFE_MS = 2100;
        const RIPPLE_SPEED_PPS = 180;
        const IDLE_RIPPLE_SPEED_PPS = 160;
        const IDLE_RIPPLE_LIFE_MS = 3800;
        const IDLE_INTENSITY = 0.085;
        const IDLE_INTERVAL_MS = 2450;
        const DRAG_THROTTLE_MS = 1;
        const IDLE_TIMEOUT_MS = 60000; // 1 minute

        // ============== SETUP ==============
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const splash = document.getElementById('splash');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let lastInteractionTime = Date.now();

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let ripples = [];
        let currentColorIndex = 0;
        let lastColor = COLORS[0];
        let hasInteracted = false;
        let midiOutput = null;
        let isDragging = false;
        let lastDragRippleTime = 0;

        // ============== MIDI ==============
        async function initMIDI() {
            if (!navigator.requestMIDIAccess) return;
            try {
                const midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                const outputs = Array.from(midiAccess.outputs.values());
                midiOutput = outputs.find(o => 
                    o.name === 'IAC Driver Bus 1' || o.name.includes('IAC Driver Bus 1')
                );
            } catch (err) {}
        }

        function sendMIDINote(noteNumber) {
            if (!midiOutput) return;
            midiOutput.send([0x90, noteNumber, MIDI_NOTE_VELOCITY]);
            setTimeout(() => {
                if (midiOutput) midiOutput.send([0x80, noteNumber, 0]);
            }, 100);
        }

        // ============== RIPPLE SYSTEM ==============
        class Ripple {
            constructor(x, y, color, intensity, speed, life) {
                this.x = x; this.y = y; this.color = color;
                this.intensity = intensity; this.speed = speed; this.life = life;
                this.birth = Date.now();
            }
            getAge() { return Date.now() - this.birth; }
            isDead() { return this.getAge() > this.life; }
            getProgress() { return Math.min(this.getAge() / this.life, 1); }
            getRadius() { return 8 + (this.getAge() / 1000) * this.speed; }
            getAlpha() {
                const progress = this.getProgress();
                return (1 - Math.pow(progress, 1.6)) * this.intensity;
            }
        }

        function createRipple(x, y, color, intensity = 1, speed = RIPPLE_SPEED_PPS, life = RIPPLE_LIFE_MS) {
            ripples.push(new Ripple(x, y, color, intensity, speed, life));
        }

        // ============== ANIMATION LOOP ==============
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.13)';
            ctx.fillRect(0, 0, width, height);

            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                if (r.isDead()) {
                    ripples.splice(i, 1);
                    continue;
                }
                const radius = r.getRadius();
                const alpha = r.getAlpha();

                ctx.shadowBlur = 22;
                ctx.shadowColor = r.color;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = r.color;
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                ctx.shadowBlur = 0;
            }

            if (hasInteracted && Date.now() - lastInteractionTime > IDLE_INTERVAL_MS) {
                const idleX = Math.random() * width;
                const idleY = Math.random() * height;
                createRipple(idleX, idleY, lastColor, IDLE_INTENSITY, IDLE_RIPPLE_SPEED_PPS, IDLE_RIPPLE_LIFE_MS);
                lastInteractionTime = Date.now();
            }

            requestAnimationFrame(animate);
        }

        // ============== SPLASH & INTERACTION ==============
        function hideSplash() {
            splash.style.transition = 'opacity 0.6s ease-out';
            splash.style.opacity = '0';
        }

        function showSplash() {
            splash.style.transition = 'opacity 5s ease-in-out';
            splash.style.opacity = '1';
        }

        function handleInteraction(e) {
            lastInteractionTime = Date.now();
            hideSplash();
            hasInteracted = true;

            if (e.type.includes('down') || e.type === 'touchstart') {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

                const color = COLORS[currentColorIndex];
                createRipple(x, y, color, 1);
                lastColor = color;

                sendMIDINote(currentColorIndex + 1);
                currentColorIndex = (currentColorIndex + 1) % COLORS.length;
            }
        }

        function checkIdle() {
            if (Date.now() - lastInteractionTime > IDLE_TIMEOUT_MS) {
                showSplash();
            }
        }

        function addListeners() {
            canvas.addEventListener('pointerdown', handleInteraction);
            canvas.addEventListener('touchstart', handleInteraction, { passive: false });

            let dragging = false;
            let lastDragTime = 0;

            canvas.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const now = Date.now();
                if (now - lastDragTime < DRAG_THROTTLE_MS) return;

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                createRipple(x, y, lastColor, 0.9, RIPPLE_SPEED_PPS * 0.85, RIPPLE_LIFE_MS * 0.8);
                lastDragTime = now;
            });

            canvas.addEventListener('pointerdown', () => dragging = true);
            canvas.addEventListener('pointerup', () => dragging = false);
            canvas.addEventListener('pointerleave', () => dragging = false);

            document.addEventListener('keydown', () => {
                if (!hasInteracted) {
                    handleInteraction({ type: 'pointerdown', clientX: width/2, clientY: height/2 });
                }
            });
        }

        // ============== START ==============
        function start() {
            initMIDI();
            addListeners();
            animate();

            setTimeout(() => showSplash(), 400);

            setInterval(checkIdle, 1000);

            // Initial subtle ripple
            setTimeout(() => {
                createRipple(width * 0.4, height * 0.45, COLORS[0], 0.14, 95, 4500);
            }, 1500);
        }

        start();
    </script>
</body>
</html>
