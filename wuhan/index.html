<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Individual Checks, Wuhan</title>
  <style>
    :root {
      --primary-color: #1e3a8a;   
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      color: #1e2937;
      min-height: 100vh;
      padding: 20px 12px;
      line-height: 1.4;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #64748b;
    }



.item {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      margin: 6px 8px;                 
    }

    .item:last-child {
      border-bottom: none;
    }

    .item.checked {
      opacity: 0.25;
      filter: grayscale(1);
    }

    label {
      display: flex;
      align-items: center;
      width: 100%;
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"] {
      display: none;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      margin-right: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      transition: all 0.2s ease;
    }

    input[type="checkbox"]:checked + .checkbox {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }

    input[type="checkbox"]:checked + .checkbox::after {
      content: '✓';
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .item-text {
      font-size: 1.08rem;
      flex: 1;
    }

    .item.checked .item-text {
      text-decoration: line-through;
      color: #475569;
    }

    .subtext {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .item.checked .subtext {
      color: #64748b;
    }
  </style>
</head>

    // Apply global settings
    document.documentElement.style.setProperty('--primary-color', config.primaryColor);
    document.getElementById('main-title').textContent = config.mainTitle;
    document.getElementById('subtitle').textContent = config.subtitle;

    // Create checklist with per-item colors
    function createChecklist() {
      const checklist = document.getElementById('checklist');
      checklist.innerHTML = '';

      config.items.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        
        // Set custom background and hover colors
        itemDiv.style.backgroundColor = item.bgColor;
        
        // Add hover effect via inline style + event listeners
        itemDiv.addEventListener('mouseenter', () => {
          if (!itemDiv.classList.contains('checked')) {
            itemDiv.style.backgroundColor = item.hoverColor;
          }
        });
        
        itemDiv.addEventListener('mouseleave', () => {
          if (!itemDiv.classList.contains('checked')) {
            itemDiv.style.backgroundColor = item.bgColor;
          }
        });

        itemDiv.innerHTML = `
          <label>
            <input type="checkbox" id="check-${index}">
            <div class="checkbox"></div>
            <div style="flex: 1;">
              <div class="item-text">${item.text}</div>
              ${item.subtext ? `<div class="subtext">${item.subtext}</div>` : ''}
            </div>
          </label>
        `;

        // Handle check/uncheck behavior
        const checkbox = itemDiv.querySelector('input');
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            itemDiv.classList.add('checked');
            // Keep the original bgColor but make it look grayed out via opacity + filter
          } else {
            itemDiv.classList.remove('checked');
            itemDiv.style.backgroundColor = item.bgColor;
          }
        });

        checklist.appendChild(itemDiv);
      });
    }

    // Initialize
    window.onload = createChecklist;
